name: Deploy to TF2 server

# What this does when you push to main:
#  1. If a .sp (source) file changed, it compiles the plugin first. If nothing .sp changed, this step is skipped,
#     so ordinary setting changes stay quick. The compiled .smx is saved back into the repo
#     (commit message ends with [skip ci]). If compiling fails, nothing is sent to the server.
#  2. Sends the server files to the VPS over SSH (rsync) and checks each one arrived by checksum.
#  3. Tells the server console to reload the plugins and re-read 88x31.cfg.
# Needs repo secrets: VPS_HOST (the VPS's IP), VPS_USER (root) and VPS_SSH_KEY (private key whose public half is in the VPS's authorized_keys).
# The result of every run is printed as ONE note on the run page (so nothing gets cut off).
on:
  push:
    branches: [main]
    paths:
      - tf/addons/sourcemod/scripting/freezetag.sp
      - tf/addons/sourcemod/scripting/88x31_settings.sp
      - tf/addons/sourcemod/plugins/freezetag.smx
      - tf/addons/sourcemod/extensions/tf2items.ext.2.ep2v.so
      - tf/addons/sourcemod/extensions/tf2items.autoload
      - tf/addons/sourcemod/gamedata/tf2.items.txt
      - tf/addons/sourcemod/translations/freezetag.phrases.txt
      - tf/addons/sourcemod/configs/freezetag_maps.cfg
      - tf/custom/freezetag_models/materials/models/custom/freezetag/ice_tint_blue.vmt
      - tf/custom/freezetag_models/materials/models/custom/freezetag/ice_tint_red.vmt
      - tf/custom/freezetag_models/models/custom/freezetag/iceshard.dx80.vtx
      - tf/custom/freezetag_models/models/custom/freezetag/iceshard.dx90.vtx
      - tf/custom/freezetag_models/models/custom/freezetag/iceshard.mdl
      - tf/custom/freezetag_models/models/custom/freezetag/iceshard.sw.vtx
      - tf/custom/freezetag_models/models/custom/freezetag/iceshard.vvd
      - tf/addons/sourcemod/plugins/88x31_settings.smx
      - tf/maps/*.bsp.bz2
      - tf/cfg/88x31.cfg
      - tf/cfg/mapcycle.txt
      - tf/cfg/mapcycle_tactical.txt
      - tf/cfg/motd_text.txt
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write   # only so the compile step can save the built .smx back to the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile, only if a .sp file changed
        id: compile
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          R="$RUNNER_TEMP/result.txt"; : > "$R"
          echo "ok=1" >> "$GITHUB_OUTPUT"
          changed=""
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- 'tf/addons/sourcemod/scripting/*.sp')
          fi
          if [ -z "$changed" ]; then
            echo "COMPILE skipped (no .sp file changed)" >> "$R"
            exit 0
          fi

          fail() { echo "COMPILE FAILED  $*" >> "$R"; echo "ok=0" > "$GITHUB_OUTPUT"; exit 1; }

          # Get the SourceMod compiler straight from alliedmods.net (no third-party action)
          W="$RUNNER_TEMP/sm"; mkdir -p "$W"
          base="https://sm.alliedmods.net/smdrop/1.12"
          name=$(curl -fsSL "$base/sourcemod-latest-linux") || fail "could not read the latest SourceMod name from $base"
          curl -fsSL "$base/$name" -o "$W/sm.tar.gz" || fail "could not download $base/$name"
          tar -xzf "$W/sm.tar.gz" -C "$W" || fail "could not unpack $name"
          SC="$W/addons/sourcemod/scripting"
          if [ -x "$SC/spcomp64" ]; then SPCOMP="$SC/spcomp64"; else SPCOMP="$SC/spcomp"; fi
          [ -x "$SPCOMP" ] || fail "no compiler (spcomp) found in $name"

          # freezetag.sp needs tf2items.inc, which SourceMod does not ship; the repo keeps the one that matches the server's extension (TF2Items 1.6.4)
          cp tf/addons/sourcemod/scripting/include/tf2items.inc "$SC/include/tf2items.inc" || fail "tf2items.inc is missing from the repo"

          note="COMPILE with $name"
          for sp in $changed; do
            out="${sp#tf/addons/sourcemod/scripting/}"; out="${out%.sp}"
            if ( cd tf/addons/sourcemod/scripting && "$SPCOMP" "$(basename "$sp")" -i "$SC/include" -o "../plugins/$out.smx" ) > "$RUNNER_TEMP/spcomp.txt" 2>&1; then
              note="$note
          OK      $sp -> tf/addons/sourcemod/plugins/$out.smx ($(stat -c %s "tf/addons/sourcemod/plugins/$out.smx") bytes)"
            else
              note="$note
          FAILED  $sp: $(tail -n 8 "$RUNNER_TEMP/spcomp.txt" | tr '\n' ' ' | cut -c1-600)"
              echo "$note" >> "$R"; echo "ok=0" > "$GITHUB_OUTPUT"; exit 1
            fi
          done
          echo "$note" | sed 's/^ *//' >> "$R"

          # Save the built plugin(s) back into the repo. [skip ci] stops this commit from starting another run.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tf/addons/sourcemod/plugins/*.smx
          if git diff --cached --quiet; then
            echo "SAVE nothing to save (built plugin identical to the one in the repo)" >> "$R"
          else
            git commit -q -m "Build plugins from changed .sp files [skip ci]"
            if git push -q origin HEAD:main 2>"$RUNNER_TEMP/pusherr"; then
              echo "SAVE built plugin(s) committed back to main" >> "$R"
            else
              echo "SAVE FAILED (the plugin is still sent to the server below): $(tr '\n' ' ' < "$RUNNER_TEMP/pusherr" | cut -c1-200)" >> "$R"
            fi
          fi

      - name: Send the files to the VPS
        id: send
        if: steps.compile.outputs.ok == '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          R="$RUNNER_TEMP/result.txt"
          say() { echo "$*" >> "$R"; }
          mkdir -p ~/.ssh && umask 077 && printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          ok=1
          for f in \
            tf/addons/sourcemod/extensions/tf2items.ext.2.ep2v.so \
            tf/addons/sourcemod/extensions/tf2items.autoload \
            tf/addons/sourcemod/gamedata/tf2.items.txt \
            tf/addons/sourcemod/translations/freezetag.phrases.txt \
            tf/addons/sourcemod/configs/freezetag_maps.cfg \
            tf/custom/freezetag_models/materials/models/custom/freezetag/ice_tint_blue.vmt \
            tf/custom/freezetag_models/materials/models/custom/freezetag/ice_tint_red.vmt \
            tf/custom/freezetag_models/models/custom/freezetag/iceshard.dx80.vtx \
            tf/custom/freezetag_models/models/custom/freezetag/iceshard.dx90.vtx \
            tf/custom/freezetag_models/models/custom/freezetag/iceshard.mdl \
            tf/custom/freezetag_models/models/custom/freezetag/iceshard.sw.vtx \
            tf/custom/freezetag_models/models/custom/freezetag/iceshard.vvd \
            tf/addons/sourcemod/plugins/freezetag.smx \
            tf/addons/sourcemod/plugins/88x31_settings.smx \
            $(ls tf/maps/*.bsp.bz2) \
            tf/cfg/88x31.cfg \
            tf/cfg/mapcycle.txt \
            tf/cfg/mapcycle_tactical.txt \
            tf/cfg/motd_text.txt
          do
            # rsync -c compares checksums, so a file is only "OK" if the copy on the server matches
            if rsync -c --chown=tf2:tf2 --rsync-path="mkdir -p /home/tf2/server/$(dirname "$f") && rsync" -e "$SSH" "$f" "$VPS_USER@$VPS_HOST:/home/tf2/server/$f" 2> "$RUNNER_TEMP/err"; then
              say "OK     /$f  ($(stat -c %s "$f") bytes)"
              case "$f" in
                tf/maps/*.bsp.bz2)   # community maps are stored packed (bzip2); unpack on the server only when the packed file is newer
                  b=$(basename "$f"); m=${b%.bz2}
                  if $SSH "$VPS_USER@$VPS_HOST" "cd /home/tf2/server/tf/maps && { [ -f $m ] && [ $m -nt $b ] || bzip2 -dkf $b; } && chown tf2:tf2 $m" 2> "$RUNNER_TEMP/err"; then say "UNPACK /tf/maps/$m"; else say "FAILED unpacking $m  $(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-200)"; ok=0; fi ;;
              esac
            else
              say "FAILED /$f  $(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-200)"; ok=0
            fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = 1 ]

      - name: Reload the plugins and apply settings
        if: steps.send.outputs.ok == '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          R="$RUNNER_TEMP/result.txt"
          SSH="ssh -i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes $VPS_USER@$VPS_HOST"
          # refresh = load new plugins and reload changed ones; then apply 88x31.cfg now.
          for c in "sm plugins refresh" "exec 88x31.cfg"; do
            if $SSH "sudo -u tf2 screen -S tf2 -X stuff \"$c\$(printf '\\r')\"" 2>"$RUNNER_TEMP/err"; then
              echo "COMMAND \"$c\"  sent to the server console" >> "$R"
            else
              echo "COMMAND \"$c\"  FAILED (is the tf2 service running?): $(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-150)" >> "$R"
            fi
            sleep 2
          done

      - name: Print the result
        if: always()
        run: |
          R="$RUNNER_TEMP/result.txt"
          [ -s "$R" ] || echo "Nothing was done (the run stopped before the first step finished)." > "$R"
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$R")
          if [ "${{ steps.compile.outputs.ok }}" = "1" ] && [ "${{ steps.send.outputs.ok }}" = "1" ]; then
            echo "::notice title=Deploy result::$msg"
          else
            echo "::error title=Deploy problem::$msg"
          fi
