name: Deploy to TF2 server

# Runs when a push to main changes any deployed file, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - tf/addons/sourcemod/plugins/freezetag.smx
      - tf/addons/sourcemod/plugins/88x31_settings.smx
      - tf/cfg/88x31.cfg
      - tf/cfg/mapcycle.txt
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload plugins to the server
        run: |
          # Plugins are binary (the "write" method mangles them).
          # Method A: panel's signed upload link. Method B: server downloads the file from GitHub.
          # Every panel reply is printed as an annotation so failures can be read without the log.
          API="$PTERO_URL/api/client/servers/$PTERO_SERVER_ID"
          AUTH=(-H "Authorization: Bearer $PTERO_API_KEY" -H "Accept: application/json")
          ok_all=1
          for f in \
            tf/addons/sourcemod/plugins/freezetag.smx \
            tf/addons/sourcemod/plugins/88x31_settings.smx
          do
            name=$(basename "$f")
            done_it=0

            r=$(curl -sS -w '\nHTTP %{http_code}' "$API/files/upload" "${AUTH[@]}" 2>&1 || true)
            echo "::notice::A1 $name: $(echo "$r" | tr '\n' ' ' | cut -c1-300)"
            url=$(echo "$r" | head -n -1 | jq -r '.attributes.url // empty' 2>/dev/null || true)
            if [ -n "$url" ]; then
              r=$(curl -sS -w '\nHTTP %{http_code}' -X POST "$url&directory=%2Ftf%2Faddons%2Fsourcemod%2Fplugins" -F "files=@$f" 2>&1 || true)
              echo "::notice::A2 $name: $(echo "$r" | tr '\n' ' ' | cut -c1-300)"
              echo "$r" | tail -n1 | grep -qE 'HTTP 2[0-9][0-9]' && done_it=1
            fi

            if [ $done_it = 0 ]; then
              raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$f"
              r=$(curl -sS -w '\nHTTP %{http_code}' -X POST "$API/files/pull" "${AUTH[@]}" \
                -H "Content-Type: application/json" \
                -d "{\"url\":\"$raw\",\"directory\":\"/tf/addons/sourcemod/plugins\",\"filename\":\"$name\",\"use_header\":false,\"foreground\":true}" 2>&1 || true)
              echo "::notice::B $name: $(echo "$r" | tr '\n' ' ' | cut -c1-300)"
              echo "$r" | tail -n1 | grep -qE 'HTTP 2[0-9][0-9]' && done_it=1
            fi

            if [ $done_it = 1 ]; then echo "Uploaded $name"; else echo "::error::Could not upload $name"; ok_all=0; fi
          done
          [ $ok_all = 1 ]

      - name: Upload text files to the server
        run: |
          # Each file goes to the same path under /home/container on the server.
          for f in \
            tf/cfg/88x31.cfg \
            tf/cfg/mapcycle.txt
          do
            p=$(printf '/%s' "$f" | sed 's|/|%2F|g')
            curl --fail-with-body -sS -X POST \
              "$PTERO_URL/api/client/servers/$PTERO_SERVER_ID/files/write?file=$p&path=$p" \
              -H "Authorization: Bearer $PTERO_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: text/plain" \
              --data-binary @"$f"
            echo "Uploaded $f"
          done

      - name: Load plugins and apply settings
        run: |
          # refresh = load new plugins and reload changed ones; then apply 88x31.cfg now.
          for c in "sm plugins refresh" "exec 88x31.cfg"; do
            curl --fail-with-body -sS -X POST \
              "$PTERO_URL/api/client/servers/$PTERO_SERVER_ID/command" \
              -H "Authorization: Bearer $PTERO_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"command\":\"$c\"}"
            echo "Sent: $c"
            sleep 2
          done
