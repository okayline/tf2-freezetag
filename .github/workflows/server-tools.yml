name: Server tools (manual only)

# Never runs on its own. Started by hand from the Actions tab (or with `gh workflow run`).
#   action = logs     reads the newest SourceMod and server log files over SFTP and prints them as ONE note
#   action = command  sends one console command to the server (the command goes in the "command" box)
#   action = restart  restarts the whole server through the panel
# Uses the same secrets as deploy.yml.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "logs, command, restart, list, show, matchoffset, noautoupdate or hash"
        required: true
        default: logs
        type: choice
        options: [logs, command, restart, list, show, matchoffset, noautoupdate, hash]
      path:
        description: "Server path for list (a folder) or show (a file), for example tf/addons/sourcemod/extensions"
        required: false
        default: ""
      command:
        description: "Console command (only for action = command)"
        required: false
        default: ""

jobs:
  tools:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      COMMAND: ${{ inputs.command }}
      SPATH: ${{ inputs.path }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - name: Run
        run: |
          set +e +o pipefail
          R="$RUNNER_TEMP/result.txt"; : > "$R"
          say() { echo "$*" >> "$R"; }
          sftp() { curl -sS -k --user "$SFTP_USER:$SFTP_PASSWORD" "$@"; }
          panel() { curl -sS -o /dev/null -w '%{http_code}' -X POST "$PTERO_URL/api/client/servers/$PTERO_SERVER_ID/$1" \
            -H "Authorization: Bearer $PTERO_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" -d "$2" 2>&1 || true; }

          case "$ACTION" in
            command)
              [ -n "$COMMAND" ] || { say "No command was given."; ok=0; }
              if [ -z "${ok:-}" ]; then
                body=$(python3 -c 'import json,os;print(json.dumps({"command":os.environ["COMMAND"]}))')
                say "COMMAND \"$COMMAND\"  panel answered HTTP $(panel command "$body")"
              fi ;;
            list)
              base="sftp://$SFTP_HOST:${SFTP_PORT:-2022}"
              sftp "$base/${SPATH%/}/" 2>&1 | tr -d '\r' | sort -k9 | cut -c1-120 | head -n 60 > "$RUNNER_TEMP/one"
              m=$(tail -c 3600 "$RUNNER_TEMP/one" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::notice title=Files in /$SPATH::$m"
              exit 0 ;;
            show)
              # prints the size of a file and the lines around GiveNamedItem / offset (or the first lines if there are none)
              base="sftp://$SFTP_HOST:${SFTP_PORT:-2022}"
              sftp "$base/$SPATH" 2>&1 | tr -d '\r' > "$RUNNER_TEMP/full"
              { echo "$(wc -c < "$RUNNER_TEMP/full") bytes, $(wc -l < "$RUNNER_TEMP/full") lines"
                if grep -q -i 'AutoUpdate' "$RUNNER_TEMP/full"; then grep -n -i -B6 -A2 'AutoUpdate' "$RUNNER_TEMP/full" | cut -c1-150
                elif grep -q -i 'GiveNamedItem' "$RUNNER_TEMP/full"; then grep -n -i -B3 -A10 'GiveNamedItem' "$RUNNER_TEMP/full" | cut -c1-150; else head -n 30 "$RUNNER_TEMP/full" | cut -c1-150; fi; } > "$RUNNER_TEMP/one"
              m=$(head -c 3600 "$RUNNER_TEMP/one" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::notice title=/$SPATH::$m"
              exit 0 ;;
            matchoffset)
              # Makes the GiveNamedItem numbers in gamedata/tf2.items.txt equal to the ones in gamedata/sdktools.games/game.tf.txt
              # (the plugin's README says they must match). Prints the old and new numbers; verifies by downloading back.
              base="sftp://$SFTP_HOST:${SFTP_PORT:-2022}/tf/addons/sourcemod/gamedata"
              D="$RUNNER_TEMP/gd"; mkdir -p "$D"
              sftp "$base/sdktools.games/game.tf.txt" -o "$D/game.tf.txt" || say "could not read game.tf.txt"
              sftp "$base/tf2.items.txt" -o "$D/tf2.items.txt" || say "could not read tf2.items.txt"
              cp "$D/tf2.items.txt" "$D/tf2.items.txt.orig"
              python3 - "$D" >> "$R" <<'PY'
          import re, sys
          d = sys.argv[1]
          g = open(d + "/game.tf.txt").read()
          t = open(d + "/tf2.items.txt").read()
          m = re.search(r'"GiveNamedItem"\s*\{(.*?)\}', g, re.S)
          want = dict(re.findall(r'"(windows64|windows|linux64|linux)"\s*"(\d+)"', m.group(1)))
          def fix(mt):
              b = mt.group(0)
              for k, v in want.items():
                  b = re.sub(r'("%s"\s*")(\d+)(")' % k, lambda x: x.group(1) + v + x.group(3), b)
              return b
          t2 = re.sub(r'"GiveNamedItem"\s*\{.*?\}', fix, t, count=1, flags=re.S)
          old = dict(re.findall(r'"(windows64|windows|linux64|linux)"\s*"(\d+)"', re.search(r'"GiveNamedItem"\s*\{(.*?)\}', t, re.S).group(1)))
          print("sdktools game.tf.txt says:", want)
          print("tf2.items.txt WAS:", old)
          open(d + "/tf2.items.txt", "w").write(t2)
          print("tf2.items.txt NOW:", dict(re.findall(r'"(windows64|windows|linux64|linux)"\s*"(\d+)"', re.search(r'"GiveNamedItem"\s*\{(.*?)\}', t2, re.S).group(1))))
          PY
              if sftp -T "$D/tf2.items.txt" "$base/tf2.items.txt" && sftp "$base/tf2.items.txt" -o "$D/back.txt" && cmp -s "$D/tf2.items.txt" "$D/back.txt"; then
                say "WROTE tf2.items.txt and downloaded it back: identical"
              else
                say "WRITE FAILED or the copy on the server differs"
              fi
              ;;
            noautoupdate)
              # Sets "DisableAutoUpdate" to "yes" in configs/core.cfg so SourceMod stops rewriting gamedata files at start-up
              base="sftp://$SFTP_HOST:${SFTP_PORT:-2022}/tf/addons/sourcemod/configs"
              D="$RUNNER_TEMP/cc"; mkdir -p "$D"
              sftp "$base/core.cfg" -o "$D/core.cfg" || say "could not read core.cfg"
              grep -n '"DisableAutoUpdate"' "$D/core.cfg" | sed 's/^/BEFORE line /' >> "$R"
              sed -i -E 's/("DisableAutoUpdate"[[:space:]]+)"no"/\1"yes"/' "$D/core.cfg"
              grep -n '"DisableAutoUpdate"' "$D/core.cfg" | sed 's/^/AFTER  line /' >> "$R"
              if sftp -T "$D/core.cfg" "$base/core.cfg" && sftp "$base/core.cfg" -o "$D/back" && cmp -s "$D/core.cfg" "$D/back"; then
                say "WROTE core.cfg and downloaded it back: identical"
              else
                say "WRITE FAILED or the copy on the server differs"
              fi
              ;;
            hash)
              # size and checksum of the file(s) at path (several paths can be separated by spaces)
              base="sftp://$SFTP_HOST:${SFTP_PORT:-2022}"
              for f in $SPATH; do
                sftp "$base/$f" -o "$RUNNER_TEMP/h" 2>/dev/null
                say "$(stat -c %s "$RUNNER_TEMP/h") bytes  sha1 $(sha1sum "$RUNNER_TEMP/h" | cut -c1-12)  /$f"
                rm -f "$RUNNER_TEMP/h"
              done
              ;;
            restart)
              say "RESTART  panel answered HTTP $(panel power '{"signal":"restart"}')" ;;
            logs)
              base="sftp://$SFTP_HOST:${SFTP_PORT:-2022}"
              # GitHub cuts a note at about 4000 characters, so every file gets its own note
              note() { # title, file holding the text
                m=$(tail -c 3600 "$2" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
                echo "::notice title=$1::$m"
              }
              for dir in tf/addons/sourcemod/logs tf/logs; do
                sftp --list-only "$base/$dir/" 2>&1 | tr -d '\r' | sort > "$RUNNER_TEMP/names"
                note "Files in /$dir/" "$RUNNER_TEMP/names"
                # newest 3 files that end in .log, errors files first
                for n in $(grep '\.log$' "$RUNNER_TEMP/names" | sort -r | head -n 3); do
                  sftp "$base/$dir/$n" 2>&1 | tr -d '\r' > "$RUNNER_TEMP/full"
                  { echo "$(wc -l < "$RUNNER_TEMP/full") lines in the file. First 12:"; head -n 12 "$RUNNER_TEMP/full" | cut -c1-130
                    echo "... last 10:"; tail -n 10 "$RUNNER_TEMP/full" | cut -c1-130; } > "$RUNNER_TEMP/one"
                  note "/$dir/$n (start and end)" "$RUNNER_TEMP/one"
                  # each different problem once, with the time it first appeared and the full message
                  grep -E 'Unable|Required|Failed|Could not|xception|UPDATER|xtension|Fatal' "$RUNNER_TEMP/full" \
                    | grep -v 'Call stack\|Blaming' | awk '!seen[substr($0,26)]++' | head -n 14 | cut -c1-290 > "$RUNNER_TEMP/one"
                  note "/$dir/$n (each different problem once)" "$RUNNER_TEMP/one"
                done
              done
              sftp "$base/tf/console.log" 2>&1 | tr -d '\r' | tail -n 25 | cut -c1-200 > "$RUNNER_TEMP/one"
              note "/tf/console.log (last 25 lines, if it exists)" "$RUNNER_TEMP/one"
              exit 0 ;;
          esac

          msg=$(head -c 40000 "$R" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Server tools ($ACTION)::$msg"
