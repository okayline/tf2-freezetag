name: VPS tools (manual only)

# Never runs on its own. Started by hand from the Actions tab (or by Claude).
#   setup    uploads vps/setup.sh to the VPS and runs it (installs steamcmd, TF2, Metamod, SourceMod, the "tf2" service). Takes a while.
#   start / stop / restart   controls the tf2 service
#   status   shows the service state and disk space
#   logs     prints the last lines of the server's screen/journal output and the newest SourceMod error log
#   command  sends one console command to the running server (goes in the "command" box)
#   install-package  apt-get installs one package (name in the box; letters, digits, . + - : only)
#   l4d-setup        installs Left 4 Dead 1 next to TF2 (service "l4d", port 27016). Takes a few minutes.
#   l4d-sourcemod    installs Metamod:Source + SourceMod into the L4D1 server and makes ryan an admin there (then restart l4d)
#   l4d-reverse-ff   installs the Reverse Friendly-Fire plugin (compiled from the author's GitHub source) into the L4D1 server
#   l4d-start / l4d-stop / l4d-restart   control the l4d service; l4d-console shows its console screen
#   add-admin        gives a Steam ID full SourceMod admin (put STEAM_0:x:y or a 17-digit SteamID64 in the box); reloads admins
#   list-maps        lists installed maps; snow/winter/event ones, or ones matching a filter in the box (like cp_|koth_)
#   list-navs        for every map in mapcycle.txt, says whether it has a bot navigation file (.nav); bots stand still on maps without one
#   map-history      shows the last 15 map changes from the SourceMod logs
#   generate-navs    builds bot navigation (.nav) files for the maps in the box (stops tf2, runs a temporary server per map, starts tf2 again; progress in /home/tf2/navgen.log, read it with show-file)
#   install-maps     downloads maps from fastdl.serveme.tf into the TF2 maps folder (map names in the box, separated by spaces, like koth_coldline cp_glacier)
#   console-view     shows what is on the game server's console screen right now (last 40 lines)
#   show-file        prints the last 100 lines of a file under /home/tf2 or /etc (path in the box)
#   list-dir         lists a folder under /home/tf2 or /etc with sizes (path in the box)
#   open-port        allows a port through the firewall, like 27015/udp (ufw, only if ufw is on)
#   system-check     OS, uptime, load, memory, disk, listening ports, firewall
#   discord-install  uploads vps/discord-status.py and discord-status-setup.sh and runs the setup (a timer that posts both servers' status to Discord every minute). The webhook links and RCON passwords stay on the VPS, never here.
#   discord-feed-install  uploads vps/discord-feed.py and discord-feed-setup.sh and starts the live TF2 feed (chat, kills, joins, round wins) once /home/tf2/discord/tf2-feed.url exists on the VPS
#   discord-feed-check    shows whether the feed is running and its last log lines (counts only, no chat text)
#   relay-install    downloads and installs sp-discordrelay with its three requirements (ripext, SteamWorks, discord-api). Stops without changing anything if a download is missing. Does not restart the server or touch settings.
#   relay-install-l4d  the same install for the Left 4 Dead 1 server (its own addons/sourcemod folder). No restart, no settings.
#   l4d-addons-off   moves the L4D server's SteamWorks, ripext, SMJansson extensions and discord_api plugin into /home/tf2/l4d/off (nothing is deleted). No restart.
#   l4d-rename       sets the L4D server name to ~*~88x31~*~ L4D cLaSSiC live (console), in the service file and in server.cfg (the service file alone loses the part after the first space), so it survives restarts. Does NOT restart.
#   l4d-log-on       turns on the L4D game log live (joins, leaves, chat, kills, friendly fire) and saves it in server.cfg. Does NOT restart.
#   l4d-log          shows the last 80 lines of the newest L4D game log (optional filter word in the box)
#   l4d-feed-status-channel  points the L4D live feed at the existing L4D status channel webhook (copies l4d.url to l4d-feed.url on the VPS) and starts it
#   logweb-install   installs the password-protected log web page on port 80 (box: salt:sha256 password hash, or empty to keep the old one)
#   mc-setup         installs Minecraft (Paper + Geyser/Floodgate so Bedrock can join), service mc, ports 25565/tcp + 19132/udp, memory capped. No start.
#   mc-start / mc-stop / mc-restart   control the mc service; mc-console shows its screen; mc-command sends one console command (like whitelist add Name); mc-log shows the latest log
#   mc-discord-install  installs the newest DiscordSRV (from Modrinth) into Minecraft, sets the bot token (repo secret MC_DISCORD_TOKEN, never printed) and the channel in the box, restarts mc
#   mc-discord-format  sets how Discord messages look in Minecraft chat: the role-colored name, then » and the message (no [Discord | role] tag); in Discord, the Minecraft name in bold; reloads DiscordSRV
#   mc-bluemap-render  turns BlueMap on (accepts its download, render threads: 4th number, default 1) and limits all maps to a square around a spot (box: X Z RADIUS [THREADS], like -330 73 1000 2; the Nether gets RADIUS/8 around X/8 Z/8); reloads BlueMap
#   mc-plugin-install  installs one Paper plugin from Modrinth for Minecraft 26.3 (its Modrinth name in the box, like coreprotect) and restarts mc; stops if there is no 26.3 build
#   mc-bluemap-install  puts the newest BlueMap for Paper 26.3 (from Modrinth) in the Minecraft plugins and restarts mc. BlueMap stays idle (no render, no web page) until its download is accepted in core.conf
#   mc-import-cleanup  deletes /root/world2.zip after a finished import (only if /home/tf2/mc/world exists)
#   mc-import        swaps in /root/world2.zip as the Minecraft world: checks the zip, stops mc, renames world to world-old (stops if world-old exists), unzips, starts mc
#   discord-check    shows whether the Discord timer is running and the last lines of what it posted (no links or passwords)
# Needs repo secrets: VPS_HOST, VPS_USER (root), VPS_SSH_KEY.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: status
        type: choice
        options: [setup, start, stop, restart, status, logs, command, install-package, console-view, show-file, list-dir, open-port, system-check, l4d-setup, l4d-start, l4d-stop, l4d-restart, l4d-console, add-admin, list-maps, install-maps, l4d-sourcemod, l4d-reverse-ff, list-navs, map-history, generate-navs, discord-install, discord-check, discord-feed-install, discord-feed-check, relay-install, relay-install-l4d, l4d-addons-off, l4d-rename, l4d-log-on, l4d-log, l4d-feed-status-channel, l4d-log-kinds, tf2-log-on, logweb-install, l4d-rotate-install, l4d-toolz-find, l4d-motd, l4d-reserve-install, l4d-command, mc-setup, mc-start, mc-stop, mc-restart, mc-console, mc-command, mc-log, mc-set, mc-motd, mc-import, mc-discord-install, mc-discord-format, mc-import-cleanup, mc-bluemap-install, mc-plugin-install, mc-bluemap-render]
      command:
        description: "command: a TF2 console command. install-package: a package name (apt). show-file / list-dir: a path under /home/tf2 or /etc. open-port: like 27015/udp"
        required: false
        default: ""

jobs:
  tools:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      COMMAND: ${{ inputs.command }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      MC_DISCORD_TOKEN: ${{ secrets.MC_DISCORD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          set +e
          mkdir -p ~/.ssh && umask 077 && printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSHO="-i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 -o LogLevel=ERROR"
          vps() { ssh $SSHO "$VPS_USER@$VPS_HOST" "$@"; }
          R="$RUNNER_TEMP/result.txt"; : > "$R"
          case "$ACTION" in
            setup)
              scp $SSHO vps/setup.sh "$VPS_USER@$VPS_HOST:/root/setup.sh" >> "$R" 2>&1 \
                && vps "bash /root/setup.sh" 2>&1 | tail -n 40 >> "$R" ;;
            start|stop|restart) vps "systemctl $ACTION tf2; sleep 2; systemctl is-active tf2" >> "$R" 2>&1 ;;
            status) vps "systemctl is-active tf2; df -h /home | tail -1; free -m | sed -n 2p" >> "$R" 2>&1 ;;
            logs)
              vps "journalctl -u tf2 -n 40 --no-pager; echo ---; f=\$(ls -t /home/tf2/server/tf/addons/sourcemod/logs/errors_*.log 2>/dev/null | head -1); [ -n \"\$f\" ] && tail -n 30 \"\$f\"" 2>&1 | tail -n 70 >> "$R" ;;
            command)
              [ -n "$COMMAND" ] || { echo "No command was given." >> "$R"; }
              [ -z "$COMMAND" ] || { printf '%s' "$COMMAND" | vps 'c=$(cat); sudo -u tf2 screen -S tf2 -X stuff "$c$(printf "\r")"' >> "$R" 2>&1 && echo "sent: $COMMAND" >> "$R"; } ;;
            install-package)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z0-9][a-z0-9.+:-]{0,60}$'; then
                vps "DEBIAN_FRONTEND=noninteractive apt-get install -y $COMMAND" 2>&1 | tail -n 15 >> "$R"
              else echo "Give one package name (lowercase letters, digits, . + - :)." >> "$R"; fi ;;
            l4d-setup)
              scp $SSHO vps/setup-l4d.sh "$VPS_USER@$VPS_HOST:/root/setup-l4d.sh" >> "$R" 2>&1 \
                && vps "bash /root/setup-l4d.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            l4d-sourcemod)
              scp $SSHO vps/setup-l4d-sourcemod.sh "$VPS_USER@$VPS_HOST:/root/setup-l4d-sourcemod.sh" >> "$R" 2>&1 \
                && vps "bash /root/setup-l4d-sourcemod.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            l4d-reverse-ff)
              scp $SSHO vps/l4d-install-reverse-ff.sh "$VPS_USER@$VPS_HOST:/root/l4d-install-reverse-ff.sh" >> "$R" 2>&1 \
                && vps "bash /root/l4d-install-reverse-ff.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            l4d-start|l4d-stop|l4d-restart) vps "systemctl ${ACTION#l4d-} l4d; sleep 2; systemctl is-active l4d" >> "$R" 2>&1 ;;
            l4d-console)
              vps 'sudo -u tf2 screen -S l4d -X hardcopy -h /home/tf2/l4d-console.txt; sleep 1; tail -n 40 /home/tf2/l4d-console.txt; echo "-- processes:"; pgrep -a srcds | grep left4dead | cut -c1-150' 2>&1 | tail -c 3200 >> "$R" ;;
            add-admin)
              SID="$COMMAND"
              if printf '%s' "$SID" | grep -Eq '^7656[0-9]{13}$'; then   # SteamID64 -> STEAM_0:y:z
                acc=$((SID - 76561197960265728)); SID="STEAM_0:$((acc % 2)):$((acc / 2))"
              fi
              if printf '%s' "$SID" | grep -Eq '^STEAM_[0-5]:[01]:[0-9]{1,12}$'; then
                vps "f=/home/tf2/server/tf/addons/sourcemod/configs/admins_simple.ini; if grep -qF '\"$SID\"' \$f 2>/dev/null; then echo 'already an admin'; else printf '\"%s\" \"z\"\n' '$SID' >> \$f; echo 'added'; fi; chown tf2:tf2 \$f; sudo -u tf2 screen -S tf2 -X stuff \"sm_reloadadmins\$(printf '\\r')\"; tail -n 3 \$f" >> "$R" 2>&1
              else echo "Give a Steam ID like STEAM_0:1:12345 or a 17-digit SteamID64." >> "$R"; fi ;;
            console-view)
              vps 'sudo -u tf2 screen -S tf2 -X hardcopy -h /home/tf2/console.txt; sleep 1; tail -n 40 /home/tf2/console.txt; echo "-- processes:"; pgrep -a srcds | cut -c1-150' 2>&1 | tail -c 3200 >> "$R" ;;
            show-file)
              if printf '%s' "$COMMAND" | grep -Eq '^/(home/tf2|etc)/[A-Za-z0-9_./-]*$' && ! printf '%s' "$COMMAND" | grep -q '\.\.'; then
                vps "tail -n 100 -- $COMMAND" 2>&1 | tail -c 3000 >> "$R"
              else echo "Give a path under /home/tf2/ or /etc/ (no ..)." >> "$R"; fi ;;
            install-maps)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z0-9_]{3,60}( [a-z0-9_]{3,60}){0,19}$'; then
                vps "command -v bzip2 >/dev/null || apt-get install -y -qq bzip2 >/dev/null 2>&1; cd /home/tf2/server/tf/maps && for m in $COMMAND; do if [ -f \$m.bsp ]; then echo \$m: already there; elif curl -fsSL -m 120 -o \$m.bsp.bz2 https://fastdl.serveme.tf/maps/\$m.bsp.bz2 && bzip2 -df \$m.bsp.bz2; then chown tf2:tf2 \$m.bsp; echo \$m: installed; else rm -f \$m.bsp.bz2; echo \$m: not found; fi; done" 2>&1 | tail -c 3000 >> "$R"
              else echo "Give map names like koth_coldline cp_glacier (letters, digits, _ only, up to 20)." >> "$R"; fi ;;
            list-maps)
              F='snow|frost|winter|xmas|ice|cold|event|polar'
              printf '%s' "$COMMAND" | grep -Eq '^[a-z0-9_|]{1,60}$' && F="$COMMAND"   # optional filter, like cp_|koth_
              vps "ls /home/tf2/server/tf/maps | grep -iE '\\.bsp$' | sed 's/\\.bsp$//' | grep -E '$F' | tr '\\n' ' '" 2>&1 | tail -c 3000 >> "$R" ;;
            list-navs)
              vps "python3 -" < vps/nav-check.py 2>&1 | tail -c 3000 >> "$R" ;;
            map-history)
              vps "grep -h 'Mapchange to' /home/tf2/server/tf/addons/sourcemod/logs/L*.log | tail -n 15" 2>&1 | tail -c 3000 >> "$R" ;;
            generate-navs)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z0-9_]{3,60}( [a-z0-9_]{3,60}){0,19}$'; then
                scp $SSHO vps/generate-navs.sh "$VPS_USER@$VPS_HOST:/root/generate-navs.sh" >> "$R" 2>&1 \
                  && vps "systemctl stop navgen 2>/dev/null; systemctl reset-failed navgen 2>/dev/null; systemd-run --unit navgen --collect /bin/bash /root/generate-navs.sh $COMMAND" 2>&1 | tail -n 5 >> "$R"
              else echo "Give map names like koth_snowtower cp_frostwatch (letters, digits, _ only, up to 20)." >> "$R"; fi ;;
            list-dir)
              if printf '%s' "$COMMAND" | grep -Eq '^/(home/tf2|etc)(/[A-Za-z0-9_./-]*)?$' && ! printf '%s' "$COMMAND" | grep -q '\.\.'; then
                vps "ls -lAh --group-directories-first -- $COMMAND" 2>&1 | head -n 60 | tail -c 3000 >> "$R"
              else echo "Give a folder under /home/tf2/ or /etc/ (no ..)." >> "$R"; fi ;;
            open-port)
              if printf '%s' "$COMMAND" | grep -Eq '^[0-9]{1,5}/(tcp|udp)$'; then
                vps "if command -v ufw >/dev/null && ufw status | grep -q active; then ufw allow $COMMAND; else echo 'ufw is not active, nothing to open (any firewall is at the VPS provider)'; fi" 2>&1 | tail -n 5 >> "$R"
              else echo "Give a port like 27015/udp." >> "$R"; fi ;;
            system-check)
              vps 'cat /etc/os-release | head -2; uptime; free -m | sed -n 1,2p; df -h / | tail -1; echo "-- listening:"; ss -tulnp | head -15; echo "-- ufw:"; (ufw status 2>&1 | head -5)' 2>&1 | tail -c 3000 >> "$R" ;;
            discord-install)
              scp $SSHO vps/discord-status.py "$VPS_USER@$VPS_HOST:/root/discord-status.py" >> "$R" 2>&1 \
                && scp $SSHO vps/discord-status-setup.sh "$VPS_USER@$VPS_HOST:/root/discord-status-setup.sh" >> "$R" 2>&1 \
                && vps "bash /root/discord-status-setup.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            discord-check)
              vps 'systemctl is-active discord-status.timer; systemctl list-timers discord-status.timer --no-pager | head -3; journalctl -u discord-status.service -n 6 --no-pager -o cat' 2>&1 | tail -c 2500 >> "$R" ;;
            discord-feed-install)
              scp $SSHO vps/discord-feed.py vps/discord-feed-l4d.py "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && scp $SSHO vps/discord-feed-setup.sh "$VPS_USER@$VPS_HOST:/root/discord-feed-setup.sh" >> "$R" 2>&1 \
                && vps "bash /root/discord-feed-setup.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            discord-feed-check)
              vps 'systemctl is-active discord-feed-tf2.service; journalctl -u discord-feed-tf2.service -n 8 --no-pager -o cat; echo -- l4d:; systemctl is-active discord-feed-l4d.service; journalctl -u discord-feed-l4d.service -n 8 --no-pager -o cat' 2>&1 | tail -c 2500 >> "$R" ;;
            relay-install)
              scp $SSHO vps/install-discordrelay.sh "$VPS_USER@$VPS_HOST:/root/install-discordrelay.sh" >> "$R" 2>&1 \
                && vps "bash /root/install-discordrelay.sh" 2>&1 | tail -c 2800 >> "$R" ;;
            relay-install-l4d)
              scp $SSHO vps/install-discordrelay.sh "$VPS_USER@$VPS_HOST:/root/install-discordrelay.sh" >> "$R" 2>&1 \
                && vps "bash /root/install-discordrelay.sh /home/tf2/l4d/left4dead" 2>&1 | tail -c 2800 >> "$R" ;;
            l4d-rename)
              vps 'N="~*~88x31~*~ L4D cLaSSiC"; sudo -u tf2 screen -S l4d -X stuff "hostname \"$N\"$(printf "\r")"; sed -i -E "s|\+hostname .*\$|+hostname \"$N\"|" /etc/systemd/system/l4d.service; systemctl daemon-reload; C=/home/tf2/l4d/left4dead/cfg/server.cfg; sed -i "/^hostname /d" $C; echo "hostname \"$N\"" >> $C; chown tf2:tf2 $C; grep -n "^hostname" $C; grep -n ExecStart /etc/systemd/system/l4d.service | cut -c1-260; sleep 1; sudo -u tf2 screen -S l4d -X stuff "status$(printf "\r")"; sleep 2; sudo -u tf2 screen -S l4d -X hardcopy -h /home/tf2/l4d-console.txt; grep -m1 hostname /home/tf2/l4d-console.txt | tail -n 2' 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-log-on)
              vps 'C=/home/tf2/l4d/left4dead/cfg/server.cfg; touch $C; for l in "log on" "sv_logfile 1" "sv_log_onefile 0" "sv_logecho 0"; do grep -qxF "$l" $C || echo "$l" >> $C; done; chown tf2:tf2 $C; sudo -u tf2 screen -S l4d -X stuff "sv_logfile 1;sv_logecho 0;log on$(printf "\r")"; sleep 3; ls -lt /home/tf2/l4d/left4dead/logs | head -4' 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-log)
              F=$(printf '%s' "$COMMAND" | tr -cd 'A-Za-z0-9_ .-')
              vps "f=\$(ls -t /home/tf2/l4d/left4dead/logs/L*.log 2>/dev/null | head -1); echo \"file: \$f\"; grep -i -- '$F' \"\$f\" | sed -E 's/<[0-9]+><STEAM_[0-9:]+>//; s/^L //' | tail -n 80" 2>&1 | tail -c 3500 >> "$R" ;;
            l4d-feed-status-channel)
              vps 'D=/home/tf2/discord; [ -s $D/l4d.url ] || { echo "no l4d.url on the VPS"; exit 0; }; install -o tf2 -g tf2 -m 600 $D/l4d.url $D/l4d-feed.url; systemctl enable discord-feed-l4d.service >/dev/null 2>&1; systemctl restart discord-feed-l4d.service; sleep 3; systemctl is-active discord-feed-l4d.service; journalctl -u discord-feed-l4d.service -n 5 --no-pager -o cat' 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-log-kinds)
              vps "cat \$(ls -t /home/tf2/l4d/left4dead/logs/L*.log | head -6) | cut -c26- | sed -E 's/\"[^\"]*\"/Q/g; s/\\([^)]*\\)/P/g; s/[0-9.-]+/N/g' | sort | uniq -c | sort -rn | head -70; echo ---; cat \$(ls -t /home/tf2/l4d/left4dead/logs/L*.log | head -6) | grep -v -e 'killed \"infected' -e 'picked up' -e rcon | grep -E 'triggered|Tank|Witch|revive|heal|incap|pounce|choke|vomit|Survivor' | cut -c26-200 | sed -E 's/<setpos[^>]*>//g' | tail -n 40" 2>&1 | tail -c 6000 >> "$R" ;;
            tf2-log-on)
              vps 'C=/home/tf2/server/tf/cfg/server.cfg; touch $C; for l in "log on" "sv_logfile 1" "sv_log_onefile 0" "sv_logecho 0"; do grep -qxF "$l" $C || echo "$l" >> $C; done; chown tf2:tf2 $C; sudo -u tf2 screen -S tf2 -X stuff "sv_logfile 1;sv_logecho 0;log on$(printf "\r")"; sleep 3; ls -lt /home/tf2/server/tf/logs | head -4' 2>&1 | tail -c 1500 >> "$R" ;;
            logweb-install)
              H=$(printf '%s' "$COMMAND" | grep -E '^[A-Za-z0-9]{4,40}:[0-9a-f]{64}$' || true)
              scp $SSHO vps/logweb.py vps/logweb-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/logweb-setup.sh '$H'" 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-rotate-install)
              scp $SSHO l4d/scripting/l4d_campaign_rotate.sp l4d/scripting/l4d_afk.sp l4d/scripting/l4d_admintools.sp l4d/configs/adminmenu_maplist.ini vps/l4d-install-rotate.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/l4d-install-rotate.sh" 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-toolz-find)
              for r in lakwsh/l4dtoolz ivailosp/l4dtoolz Accelerator74/l4dtoolz; do echo "== $r"; curl -s "https://api.github.com/repos/$r/releases?per_page=4" | grep -E '"(tag_name|browser_download_url)"' | head -12; done >> "$R" 2>&1 ;;
            l4d-motd)
              scp $SSHO l4d/motd/motd.txt l4d/motd/host.txt "$VPS_USER@$VPS_HOST:/home/tf2/l4d/left4dead/" >> "$R" 2>&1 \
                && vps 'cd /home/tf2/l4d/left4dead && chown tf2:tf2 motd.txt host.txt && ls -l motd.txt host.txt' >> "$R" 2>&1 ;;
            l4d-reserve-install)
              scp $SSHO l4d/scripting/l4d_reserve.sp vps/l4d-install-reserve.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/l4d-install-reserve.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            l4d-command)
              C=$(printf '%s' "$COMMAND" | tr -cd 'A-Za-z0-9_ .;-')
              vps "sudo -u tf2 screen -S l4d -X stuff \"$C\$(printf '\\r')\"; sleep 2; sudo -u tf2 screen -S l4d -X hardcopy -h /home/tf2/l4d-console.txt; tail -n 15 /home/tf2/l4d-console.txt" 2>&1 | tail -c 2500 >> "$R" ;;
            mc-setup)
              scp $SSHO vps/setup-minecraft.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/setup-minecraft.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            mc-start|mc-stop|mc-restart) vps "systemctl ${ACTION#mc-} mc; sleep 3; systemctl is-active mc; free -m | sed -n 2p" >> "$R" 2>&1 ;;
            mc-console)
              vps 'sudo -u tf2 screen -S mc -X hardcopy -h /home/tf2/mc-console.txt; sleep 1; tail -n 40 /home/tf2/mc-console.txt; systemctl is-active mc; ps -o rss=,pcpu= -C java' 2>&1 | tail -c 3200 >> "$R" ;;
            mc-command)
              C=$(printf '%s' "$COMMAND" | tr -cd 'A-Za-z0-9_ .:-')
              vps "sudo -u tf2 screen -S mc -X stuff \"$C\$(printf '\\r')\"; sleep 2; tail -n 12 /home/tf2/mc/logs/latest.log" 2>&1 | tail -c 2500 >> "$R" ;;
            mc-set)   # box: key=value for server.properties (applies on next mc restart)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z.-]{2,50}=[A-Za-z0-9_.-]{0,40}$'; then
                k=${COMMAND%%=*}
                vps "f=/home/tf2/mc/server.properties; if grep -q '^$k=' \$f; then sed -i 's|^$k=.*|$COMMAND|' \$f; else echo '$COMMAND' >> \$f; fi; grep '^$k=' \$f; echo players:; sudo -u tf2 screen -S mc -X stuff \"list\$(printf '\\r')\"; sleep 1; tail -n 2 /home/tf2/mc/logs/latest.log" 2>&1 | tail -c 1500 >> "$R"
              else echo "Give key=value." >> "$R"; fi ;;
            mc-motd)   # fixed server description; applies on next mc restart
              vps 'f=/home/tf2/mc/server.properties; sed -i "s|^motd=.*|motd=\\\\u00a7d~*~88x31 cLuB~*~\\\\u00a7r mInEcRaFt VaNiLLa|" $f; grep ^motd= $f; echo players:; sudo -u tf2 screen -S mc -X stuff "list$(printf "\r")"; sleep 1; tail -n 1 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 1500 >> "$R" ;;
            mc-log) vps 'tail -n 60 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 3500 >> "$R" ;;
            mc-discord-install)
              CH=$(printf '%s' "$COMMAND" | tr -cd '0-9')
              if [ -z "$MC_DISCORD_TOKEN" ] || [ -z "$CH" ]; then echo "Needs the MC_DISCORD_TOKEN secret and a channel ID in the box." >> "$R"
              else
                printf '%s' "$MC_DISCORD_TOKEN" | vps 'umask 077; cat > /root/mc-discord-token' 2>&1 >> "$R"
                vps "P=/home/tf2/mc/plugins; C=\$P/DiscordSRV/config.yml
                  U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/discordsrv/version?loaders=%5B%22paper%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                  [ -n \"\$U\" ] || { echo 'could not find DiscordSRV on Modrinth'; exit 0; }
                  echo \"DiscordSRV \${U%% *}\"; curl -fsSL -o \$P/DiscordSRV.jar.new \"\${U#* }\" && mv \$P/DiscordSRV.jar.new \$P/DiscordSRV.jar || { echo 'download failed'; exit 0; }
                  chown tf2:tf2 \$P/DiscordSRV.jar
                  if [ ! -f \$C ]; then systemctl restart mc; for i in \$(seq 60); do [ -f \$C ] && break; sleep 3; done; fi
                  [ -f \$C ] || { echo 'DiscordSRV did not make its config'; exit 0; }
                  T=\$(cat /root/mc-discord-token); sed -i -e \"s|^BotToken:.*|BotToken: \\\"\$T\\\"|\" -e \"s|^Channels:.*|Channels: {\\\"global\\\": \\\"$CH\\\"}|\" \$C; T=
                  rm -f /root/mc-discord-token; chown tf2:tf2 \$C; systemctl restart mc; sleep 40
                  grep -i 'discordsrv' /home/tf2/mc/logs/latest.log | grep -iv token | tail -n 12" 2>&1 | tail -c 2500 >> "$R"
              fi ;;
            mc-discord-format)
              vps 'M=/home/tf2/mc/plugins/DiscordSRV/messages.yml; echo before:; grep -n "^DiscordToMinecraftChatMessageFormat\|^MinecraftChatToDiscordMessageFormat" $M
                sed -i -e "s|^DiscordToMinecraftChatMessageFormat:.*|DiscordToMinecraftChatMessageFormat: \"%toprolecolor%%name%<reset>%reply% » %message%\"|" -e "s|^DiscordToMinecraftChatMessageFormatNoRole:.*|DiscordToMinecraftChatMessageFormatNoRole: \"%name%%reply% » %message%\"|" -e "s|^MinecraftChatToDiscordMessageFormat:.*|MinecraftChatToDiscordMessageFormat: \"**%displayname%** » %message%\"|" -e "s|^MinecraftChatToDiscordMessageFormatNoPrimaryGroup:.*|MinecraftChatToDiscordMessageFormatNoPrimaryGroup: \"**%displayname%** » %message%\"|" $M
                echo after:; grep -n "^DiscordToMinecraftChatMessageFormat\|^MinecraftChatToDiscordMessageFormat" $M
                sudo -u tf2 screen -S mc -X stuff "discord reload$(printf "\r")"; sleep 4; tail -n 4 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 1500 >> "$R" ;;
            mc-import-cleanup) vps '[ -d /home/tf2/mc/world ] || { echo "no world folder, not deleting"; exit 0; }; rm -fv /root/world2.zip; df -h / | tail -1' 2>&1 | tail -c 800 >> "$R" ;;
            mc-bluemap-install)
              vps "P=/home/tf2/mc/plugins
                U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/bluemap/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.3%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                [ -n \"\$U\" ] || { echo 'could not find BlueMap for 26.3 on Modrinth'; exit 0; }
                echo \"BlueMap \${U%% *}\"; curl -fsSL -o \$P/BlueMap.jar.new \"\${U#* }\" && mv \$P/BlueMap.jar.new \$P/BlueMap.jar || { echo 'download failed'; exit 0; }
                chown tf2:tf2 \$P/BlueMap.jar; systemctl restart mc; sleep 50
                grep -i 'bluemap' /home/tf2/mc/logs/latest.log | tail -n 8; grep -n 'accept-download' \$P/BlueMap/core.conf 2>/dev/null" 2>&1 | tail -c 2000 >> "$R" ;;
            mc-plugin-install)
              S=$(printf '%s' "$COMMAND" | tr -cd 'a-z0-9_-')
              if [ -z "$S" ]; then echo "Put the plugin's Modrinth name in the box." >> "$R"; else
              vps "P=/home/tf2/mc/plugins
                U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/$S/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.3%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                [ -n \"\$U\" ] || { echo 'no Paper build of $S for 26.3 on Modrinth, nothing changed'; exit 0; }
                echo \"$S \${U%% *}\"; curl -fsSL -o \$P/$S.jar.new \"\${U#* }\" && mv \$P/$S.jar.new \$P/$S.jar || { echo 'download failed'; exit 0; }
                chown tf2:tf2 \$P/$S.jar; systemctl restart mc; sleep 50
                grep -i '$S' /home/tf2/mc/logs/latest.log | tail -n 6" 2>&1 | tail -c 2000 >> "$R"; fi ;;
            mc-bluemap-render)
              set -- $(printf '%s' "$COMMAND" | tr -cd '0-9 -')
              if [ $# -lt 3 ]; then echo "Give X Z RADIUS [THREADS], like -330 73 1000 or -330 73 1000 2." >> "$R"; else
              vps "B=/home/tf2/mc/plugins/BlueMap; X=$1; Z=$2; R=$3; N=${4:-1}
                sed -i -e 's/^accept-download:.*/accept-download: true/' -e \"s/^render-thread-count:.*/render-thread-count: \$N/\" \$B/core.conf
                mask() { f=\$B/maps/\$1.conf; [ -f \$f ] || return; sed -i '/^# 88x31 render area/,\$d' \$f
                  printf '# 88x31 render area (mc-bluemap-render)\nrender-mask: [ { min-x: %d, max-x: %d, min-z: %d, max-z: %d } ]\n' \$((\$2-\$4)) \$((\$2+\$4)) \$((\$3-\$4)) \$((\$3+\$4)) >> \$f; }
                mask world \$X \$Z \$R; mask world_the_end \$X \$Z \$R; mask world_the_nether \$((\$X/8)) \$((\$Z/8)) \$((\$R/8))
                chown -R tf2:tf2 \$B; grep -n '^accept-download\|^render-thread-count' \$B/core.conf; tail -n 1 \$B/maps/world.conf
                sudo -u tf2 screen -S mc -X stuff \"bluemap reload\$(printf '\\r')\"; sleep 25
                grep -i 'bluemap' /home/tf2/mc/logs/latest.log | tail -n 8" 2>&1 | tail -c 2000 >> "$R"; fi ;;
            mc-import)
              vps 'Z=/root/world2.zip; D=/home/tf2/mc; T=$D/import-tmp
                [ -f $Z ] || { echo "no $Z"; exit 0; }
                command -v unzip >/dev/null || { echo "unzip is not installed"; exit 0; }
                unzip -tq $Z >/dev/null || { echo "zip is incomplete or broken (still uploading?)"; exit 0; }
                [ -e $D/world-old ] && { echo "$D/world-old already exists, not touching anything"; exit 0; }
                rm -rf $T; mkdir -p $T; unzip -q $Z -d $T || { echo "unzip failed"; rm -rf $T; exit 0; }
                L=$(find $T -maxdepth 3 -name level.dat | head -1); [ -n "$L" ] || { echo "no level.dat in the zip"; rm -rf $T; exit 0; }
                systemctl stop mc; [ -d $D/world ] && mv $D/world $D/world-old
                mv "$(dirname "$L")" $D/world; rm -rf $T; rm -f $D/world/session.lock; chown -R tf2:tf2 $D/world
                systemctl start mc; sleep 3; systemctl is-active mc; du -sh $D/world $D/world-old 2>/dev/null; df -h /home | tail -1' 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-addons-off)
              vps 'S=/home/tf2/l4d/left4dead/addons/sourcemod; mkdir -p /home/tf2/l4d/off; for f in extensions/rip.ext.so extensions/SteamWorks.ext.so extensions/smjansson.ext.so plugins/discord_api.smx; do if [ -e "$S/$f" ]; then mv "$S/$f" /home/tf2/l4d/off/ && echo "moved $f"; else echo "not there: $f"; fi; done; echo "-- now in /home/tf2/l4d/off:"; ls /home/tf2/l4d/off' 2>&1 | tail -c 1200 >> "$R" ;;
          esac
          [ -s "$R" ] || echo "(no output)" >> "$R"
          m=$(tail -c 7000 "$R" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/ | /g')
          echo "::notice title=VPS $ACTION::$m"
