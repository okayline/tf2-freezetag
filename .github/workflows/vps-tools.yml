                && vps 'cd /home/tf2/l4d-b/left4dead && chown tf2:tf2 motd.txt; sed -i "s/<!--LEADERBOARD-->//" motd.txt; ls -l motd.txt; grep -o "<h2>[^<]*" motd.txt' >> "$R" 2>&1
              scp $SSHO l4d/motd/motd-vs.txt "$VPS_USER@$VPS_HOST:/root/l4dvs-motd-template.html" >> "$R" 2>&1 \
                && vps 'D=/home/tf2/leaderboard-l4dvs; if [ -d $D ]; then install -o tf2 -g tf2 -m 644 /root/l4dvs-motd-template.html $D/template.html && systemctl start leaderboard-l4dvs.service && echo "leaderboard rebuilt"; fi' >> "$R" 2>&1 ;;
            l4db-order)
              O=""; IFS=',' read -ra P <<< "$COMMAND"
              for x in "${P[@]}"; do
                x=$(printf '%s' "$x" | tr 'A-Z' 'a-z' | tr -cd 'a-z ' | sed -E 's/^ +//; s/ +$//; s/^the //')
                case "$x" in "no mercy"|hospital) k=hospital;; "crash course"|garage) k=garage;; "death toll"|smalltown) k=smalltown;; "dead air"|airport) k=airport;; "blood harvest"|farm) k=farm;; "sacrifice"|river) k=river;; *) k="";; esac
                [ -n "$k" ] && O="$O $k"
              done
              O=$(echo $O)
              if [ "$(echo $O | wc -w)" -lt 2 ]; then echo "Give the campaigns in order, separated by commas, like: No Mercy, Blood Harvest, Death Toll" >> "$R"
              else
                printf '%s' "$O" | vps 'O=$(cat); C=/home/tf2/l4d-b/left4dead/cfg/server.cfg; sed -i "/^l4d_rotate_order /d" $C; echo "l4d_rotate_order \"$O\"" >> $C; chown tf2:tf2 $C; F=${O%% *}; case $F in hospital) M=l4d_vs_hospital01_apartment;; garage) M=l4d_vs_garage01_alleys;; smalltown) M=l4d_vs_smalltown01_caves;; airport) M=l4d_vs_airport01_greenhouse;; farm) M=l4d_vs_farm01_hilltop;; river) M=l4d_vs_river01_docks;; esac; sed -i -E "s# \+map [^ ]+# +map $M#" /etc/systemd/system/l4db.service; systemctl daemon-reload; sudo -u tf2 screen -S l4db -X stuff "l4d_rotate_order \"$O\"$(printf "\r")"; sleep 2; sudo -u tf2 screen -S l4db -X hardcopy -h /home/tf2/l4db-console.txt; echo "server.cfg: $(grep "^l4d_rotate_order" $C)"; echo "starts on: $M"; grep "l4d_rotate_order" /home/tf2/l4db-console.txt | tail -n 2' >> "$R" 2>&1
              fi ;;
            l4db-admins)
              ID=$(grep -oE 'STEAM_[0-5]:[01]:[0-9]+' vps/setup-l4d-sourcemod.sh | head -n 1)
              vps "A=/home/tf2/l4d/left4dead/addons/sourcemod; B=/home/tf2/l4d-b/left4dead/addons/sourcemod; echo '== plugins: differences (< first, > second) =='; diff <(ls \$A/plugins/*.smx | xargs -n1 basename) <(ls \$B/plugins/*.smx | xargs -n1 basename) && echo '(same plugins)'; echo '== sourcemod config files: differences =='; diff -rq \$A/configs \$B/configs | sed -E 's#/home/tf2/##g' && echo '(same files)'; echo '== owner in admins_simple.ini? =='; for f in \$A \$B; do if grep -qF '$ID' \$f/configs/admins_simple.ini; then echo yes; else echo NO; fi; done" 2>&1 | tail -c 2500 >> "$R" ;;
            l4db-cfg)
              vps 'm() { grep -vE "^\s*(//|$)" "$1" | sed -E "s/^([A-Za-z_0-9]*(pass|token|hook|secret|key|rcon)[A-Za-z_0-9]*) .*/\1 (hidden)/I"; }; G=/home/tf2/l4d-b/left4dead; echo "== server.cfg (second server) =="; m $G/cfg/server.cfg; echo "== differs from the first server (< first, > second) =="; diff <(m /home/tf2/l4d/left4dead/cfg/server.cfg) <(m $G/cfg/server.cfg) && echo "(no differences)"; echo "== plugins (second) =="; ls $G/addons/sourcemod/plugins/*.smx | xargs -n1 basename | tr "\n" " "; echo' 2>&1 | tail -c 3800 >> "$R" ;;
            l4db-rotate-install)
              scp $SSHO l4d/scripting/l4d_campaign_rotate.sp vps/l4db-install-rotate.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/l4db-install-rotate.sh" 2>&1 | tail -c 2000 >> "$R" ;;
            tf2-pause) vps "systemctl disable --now tf2 2>&1 | tail -n 2; systemctl is-active tf2; systemctl is-enabled tf2" >> "$R" 2>&1 ;;
            tf2-resume) vps "systemctl enable --now tf2 2>&1 | tail -n 2; sleep 3; systemctl is-active tf2; systemctl is-enabled tf2" >> "$R" 2>&1 ;;
            tf2-gslt) gslt ;;
            mc-setup)
              scp $SSHO vps/setup-minecraft.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/setup-minecraft.sh" 2>&1 | tail -c 2500 >> "$R" ;;
            mc-start|mc-stop|mc-restart) vps "systemctl ${ACTION#mc-} mc; sleep 3; systemctl is-active mc; free -m | sed -n 2p" >> "$R" 2>&1 ;;
            mc-console)
              vps 'sudo -u tf2 screen -S mc -X hardcopy -h /home/tf2/mc-console.txt; sleep 1; tail -n 40 /home/tf2/mc-console.txt; systemctl is-active mc; ps -o rss=,pcpu= -C java' 2>&1 | tail -c 3200 >> "$R" ;;
            mc-command)
              C=$(printf '%s' "$COMMAND" | tr -cd 'A-Za-z0-9_ .:-')
              vps "sudo -u tf2 screen -S mc -X stuff \"$C\$(printf '\\r')\"; sleep 2; tail -n 12 /home/tf2/mc/logs/latest.log" 2>&1 | tail -c 2500 >> "$R" ;;
            mc-set)   # box: key=value for server.properties (applies on next mc restart)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z.-]{2,50}=[A-Za-z0-9_.-]{0,40}$'; then
                k=${COMMAND%%=*}
                vps "f=/home/tf2/mc/server.properties; if grep -q '^$k=' \$f; then sed -i 's|^$k=.*|$COMMAND|' \$f; else echo '$COMMAND' >> \$f; fi; grep '^$k=' \$f; echo players:; sudo -u tf2 screen -S mc -X stuff \"list\$(printf '\\r')\"; sleep 1; tail -n 2 /home/tf2/mc/logs/latest.log" 2>&1 | tail -c 1500 >> "$R"
              else echo "Give key=value." >> "$R"; fi ;;
            mc-motd)   # fixed server description; applies on next mc restart
              vps 'f=/home/tf2/mc/server.properties; sed -i "s|^motd=.*|motd=\\\\u00a7d~*~88x31 cLuB~*~\\\\u00a7r mInEcRaFt VaNiLLa|" $f; grep ^motd= $f; echo players:; sudo -u tf2 screen -S mc -X stuff "list$(printf "\r")"; sleep 1; tail -n 1 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 1500 >> "$R" ;;
            mc-log) vps 'tail -n 60 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 3500 >> "$R" ;;
            mc-discord-install)
              CH=$(printf '%s' "$COMMAND" | tr -cd '0-9')
              if [ -z "$MC_DISCORD_TOKEN" ] || [ -z "$CH" ]; then echo "Needs the MC_DISCORD_TOKEN secret and a channel ID in the box." >> "$R"
              else
                printf '%s' "$MC_DISCORD_TOKEN" | vps 'umask 077; cat > /root/mc-discord-token' 2>&1 >> "$R"
                vps "P=/home/tf2/mc/plugins; C=\$P/DiscordSRV/config.yml
                  U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/discordsrv/version?loaders=%5B%22paper%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                  [ -n \"\$U\" ] || { echo 'could not find DiscordSRV on Modrinth'; exit 0; }
                  echo \"DiscordSRV \${U%% *}\"; curl -fsSL -o \$P/DiscordSRV.jar.new \"\${U#* }\" && mv \$P/DiscordSRV.jar.new \$P/DiscordSRV.jar || { echo 'download failed'; exit 0; }
                  chown tf2:tf2 \$P/DiscordSRV.jar
                  if [ ! -f \$C ]; then systemctl restart mc; for i in \$(seq 60); do [ -f \$C ] && break; sleep 3; done; fi
                  [ -f \$C ] || { echo 'DiscordSRV did not make its config'; exit 0; }
                  T=\$(cat /root/mc-discord-token); sed -i -e \"s|^BotToken:.*|BotToken: \\\"\$T\\\"|\" -e \"s|^Channels:.*|Channels: {\\\"global\\\": \\\"$CH\\\"}|\" \$C; T=
                  rm -f /root/mc-discord-token; chown tf2:tf2 \$C; systemctl restart mc; sleep 40
                  grep -i 'discordsrv' /home/tf2/mc/logs/latest.log | grep -iv token | tail -n 12" 2>&1 | tail -c 2500 >> "$R"
              fi ;;
            mc-discord-format)
              vps 'M=/home/tf2/mc/plugins/DiscordSRV/messages.yml; echo before:; grep -n "^DiscordToMinecraftChatMessageFormat\|^MinecraftChatToDiscordMessageFormat" $M
                sed -i -e "s|^DiscordToMinecraftChatMessageFormat:.*|DiscordToMinecraftChatMessageFormat: \"%toprolecolor%%name%<reset>%reply% » %message%\"|" -e "s|^DiscordToMinecraftChatMessageFormatNoRole:.*|DiscordToMinecraftChatMessageFormatNoRole: \"%name%%reply% » %message%\"|" -e "s|^MinecraftChatToDiscordMessageFormat:.*|MinecraftChatToDiscordMessageFormat: \"**%displayname%** » %message%\"|" -e "s|^MinecraftChatToDiscordMessageFormatNoPrimaryGroup:.*|MinecraftChatToDiscordMessageFormatNoPrimaryGroup: \"**%displayname%** » %message%\"|" $M
                echo after:; grep -n "^DiscordToMinecraftChatMessageFormat\|^MinecraftChatToDiscordMessageFormat" $M
                sudo -u tf2 screen -S mc -X stuff "discord reload$(printf "\r")"; sleep 4; tail -n 4 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 1500 >> "$R" ;;
            mc-import-cleanup) vps '[ -d /home/tf2/mc/world ] || { echo "no world folder, not deleting"; exit 0; }; rm -fv /root/world2.zip; df -h / | tail -1' 2>&1 | tail -c 800 >> "$R" ;;
            mc-bluemap-install)
              vps "P=/home/tf2/mc/plugins
                U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/bluemap/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.3%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                [ -n \"\$U\" ] || { echo 'could not find BlueMap for 26.3 on Modrinth'; exit 0; }
                echo \"BlueMap \${U%% *}\"; curl -fsSL -o \$P/BlueMap.jar.new \"\${U#* }\" && mv \$P/BlueMap.jar.new \$P/BlueMap.jar || { echo 'download failed'; exit 0; }
                chown tf2:tf2 \$P/BlueMap.jar; systemctl restart mc; sleep 50
                grep -i 'bluemap' /home/tf2/mc/logs/latest.log | tail -n 8; grep -n 'accept-download' \$P/BlueMap/core.conf 2>/dev/null" 2>&1 | tail -c 2000 >> "$R" ;;
            mc-plugin-install)
              S=$(printf '%s' "$COMMAND" | tr -cd 'a-z0-9_-')
              if [ -z "$S" ]; then echo "Put the plugin's Modrinth name in the box." >> "$R"; else
              vps "P=/home/tf2/mc/plugins
                U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/$S/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.3%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                [ -n \"\$U\" ] || { echo 'no Paper build of $S for 26.3 on Modrinth, nothing changed'; exit 0; }
                echo \"$S \${U%% *}\"; curl -fsSL -o \$P/$S.jar.new \"\${U#* }\" && mv \$P/$S.jar.new \$P/$S.jar || { echo 'download failed'; exit 0; }
                chown tf2:tf2 \$P/$S.jar; systemctl restart mc; sleep 50
                grep -i '$S' /home/tf2/mc/logs/latest.log | tail -n 6" 2>&1 | tail -c 2000 >> "$R"; fi ;;
            mc-bluemap-render)
              set -- $(printf '%s' "$COMMAND" | tr -cd '0-9 -')
              if [ $# -lt 3 ]; then echo "Give X Z RADIUS [THREADS], like -330 73 1000 or -330 73 1000 2." >> "$R"; else
              vps "B=/home/tf2/mc/plugins/BlueMap; X=$1; Z=$2; R=$3; N=${4:-1}
                sed -i -e 's/^accept-download:.*/accept-download: true/' -e \"s/^render-thread-count:.*/render-thread-count: \$N/\" \$B/core.conf
                mask() { f=\$B/maps/\$1.conf; [ -f \$f ] || return; sed -i '/^# 88x31 render area/,\$d' \$f
                  printf '# 88x31 render area (mc-bluemap-render)\nrender-mask: [ { min-x: %d, max-x: %d, min-z: %d, max-z: %d } ]\n' \$((\$2-\$4)) \$((\$2+\$4)) \$((\$3-\$4)) \$((\$3+\$4)) >> \$f; }
                mask world \$X \$Z \$R; mask world_the_end \$X \$Z \$R; mask world_the_nether \$((\$X/8)) \$((\$Z/8)) \$((\$R/8))
                chown -R tf2:tf2 \$B; grep -n '^accept-download\|^render-thread-count' \$B/core.conf; tail -n 1 \$B/maps/world.conf
                sudo -u tf2 screen -S mc -X stuff \"bluemap reload\$(printf '\\r')\"; sleep 25
                grep -i 'bluemap' /home/tf2/mc/logs/latest.log | tail -n 8" 2>&1 | tail -c 2000 >> "$R"; fi ;;
            disk-usage) vps 'du -sh /home/tf2/* 2>/dev/null | sort -h; echo "-- TF2 server:"; du -sh /home/tf2/server/* /home/tf2/server/tf/* 2>/dev/null | sort -h | tail -n 12; df -h / | tail -1' 2>&1 | tail -c 2500 >> "$R" ;;
            map-https)
              scp $SSHO vps/Caddyfile vps/logweb.py vps/logweb-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps 'bash /root/logweb-setup.sh 2>&1 | tail -n 3; command -v caddy >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq caddy >/dev/null; caddy version | head -1; install -m 644 /root/Caddyfile /etc/caddy/Caddyfile && caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -n 2; systemctl enable caddy >/dev/null 2>&1; systemctl restart caddy; sleep 20; systemctl is-active caddy; journalctl -u caddy -n 40 --no-pager -o cat | grep -iE "certificate obtained|error|could not" | tail -n 6; curl -s -o /dev/null -w "map via caddy: HTTP %{http_code}\n" --resolve map.88x31.app:443:127.0.0.1 https://map.88x31.app/; curl -s -o /dev/null -w "logs on port 80: HTTP %{http_code}\n" http://127.0.0.1/' 2>&1 | tail -c 2500 >> "$R" ;;
            mc-import)
              vps 'Z=/root/world2.zip; D=/home/tf2/mc; T=$D/import-tmp
                [ -f $Z ] || { echo "no $Z"; exit 0; }
                command -v unzip >/dev/null || { echo "unzip is not installed"; exit 0; }
                unzip -tq $Z >/dev/null || { echo "zip is incomplete or broken (still uploading?)"; exit 0; }
                [ -e $D/world-old ] && { echo "$D/world-old already exists, not touching anything"; exit 0; }
                rm -rf $T; mkdir -p $T; unzip -q $Z -d $T || { echo "unzip failed"; rm -rf $T; exit 0; }
                L=$(find $T -maxdepth 3 -name level.dat | head -1); [ -n "$L" ] || { echo "no level.dat in the zip"; rm -rf $T; exit 0; }
                systemctl stop mc; [ -d $D/world ] && mv $D/world $D/world-old
                mv "$(dirname "$L")" $D/world; rm -rf $T; rm -f $D/world/session.lock; chown -R tf2:tf2 $D/world
                systemctl start mc; sleep 3; systemctl is-active mc; du -sh $D/world $D/world-old 2>/dev/null; df -h /home | tail -1' 2>&1 | tail -c 1500 >> "$R" ;;
            l4d-addons-off)
              vps 'S=/home/tf2/l4d/left4dead/addons/sourcemod; mkdir -p /home/tf2/l4d/off; for f in extensions/rip.ext.so extensions/SteamWorks.ext.so extensions/smjansson.ext.so plugins/discord_api.smx; do if [ -e "$S/$f" ]; then mv "$S/$f" /home/tf2/l4d/off/ && echo "moved $f"; else echo "not there: $f"; fi; done; echo "-- now in /home/tf2/l4d/off:"; ls /home/tf2/l4d/off' 2>&1 | tail -c 1200 >> "$R" ;;
          esac
          [ -s "$R" ] || echo "(no output)" >> "$R"
          m=$(tail -c 7000 "$R" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/ | /g')
          echo "::notice title=VPS $ACTION::$m"
