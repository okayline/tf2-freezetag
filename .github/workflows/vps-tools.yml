name: VPS tools (manual only)

# Never runs on its own. Started by hand from the Actions tab (or by Claude).
#   run         runs one command as root on the VPS (box: the command). Public logs: keep passwords, tokens, IPs and Steam IDs out of the output.
#   l4d-deploy  sets up or updates one L4D server from the l4d/ folder (box: classic, versus or vintage; add "clean" for a fresh install). Never starts it.
#   tf2-prune-maps  removes TF2 maps nobody plays (box: dry = only show, go = remove). Keeps the map cycle maps and maps with a .nav file.
#   ban-player  permanent ban on every running L4D server (box: the exact player name; the Steam ID is looked up in the logs and never shown). A server that is off is skipped.
#   setup    uploads vps/setup.sh to the VPS and runs it (installs steamcmd, TF2, Metamod, SourceMod, the "tf2" service), then puts the login token back (same as tf2-gslt). Takes a while.
#   status   shows the service state and disk space
#   l4d-setup        installs or copies an L4D server (box: classic = installs Left 4 Dead 1, service "l4d", port 27016; versus = copy in /home/tf2/l4d-b, port 27017; vintage = copy in /home/tf2/l4d-c, port 27018, co-op). Big game files are hard links. Starts nothing; run l4d-deploy after.
#   add-admin        gives a Steam ID full SourceMod admin (put STEAM_0:x:y or a 17-digit SteamID64 in the box); reloads admins
#   generate-navs    builds bot navigation (.nav) files for the maps in the box (stops tf2, runs a temporary server per map, starts tf2 again; progress in /home/tf2/navgen.log, read it with run: tail -n 50 /home/tf2/navgen.log)
#   install-maps     downloads maps from fastdl.serveme.tf into the TF2 maps folder (map names in the box, separated by spaces, like koth_coldline cp_glacier)
#   system-check     OS, uptime, load, memory, disk, listening ports, firewall
#   web              Web jobs: stats (public stats page), logs (password-protected log page; box: its password), https (Caddy on ports 80/443).
#   mc               Minecraft jobs. The box starts with the job: setup, set, motd, discord-install, discord-format, bluemap-install, plugin-install, bluemap-render, import; the rest of the box is that job's own text (for example "set ..." or "plugin <modrinth name>"). Details are in the comments of each job in the workflow.
#   leaderboard      Welcome-page stats board: install (box after the job: tf2, l4d, l4dvs, l4dc or all, then optional days, like "install tf2 5"), ignore (box after the job: a Steam ID to leave out of the boards).
#   motd             Welcome-screen jobs: classic (l4d/motd/motd.txt on the first L4D server), versus (motd-vs.txt on the second), host (host.txt on all three L4D servers). Players see them when they join.
#   vintage          ViNtaGe (l4d-c) server access: private (box after the job: the password, letters and digits), public, unlock (takes the password off, keeps the welcome screen).
#   l4d-sessions     lists when humans joined and left, on all three L4D servers, from the last 3 hours of game logs (bots, IPs and Steam IDs left out; names and times only)
#   tf2-gslt         puts the TF2 server login token (repo secret TF2_GSLT, never printed) into the tf2 service launch line. Does NOT restart; run restart afterwards. setup does this on its own too. run hides the token as (hidden).
#   backup           Backup jobs: install (restic + rclone + nightly timer), run (box after the job: "keep" or "keep SNAPSHOTID" tags a snapshot so cleanup never deletes it), status, restore (box after the job: empty = into /root/restore, "apply" = put files back).
# Needs repo secrets: VPS_HOST, VPS_USER (root), VPS_SSH_KEY.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: status
        type: choice
        options: [run, l4d-deploy, ban-player, tf2-prune-maps, setup, status, system-check, l4d-setup, add-admin, install-maps, generate-navs, web, motd, l4d-sessions, leaderboard, tf2-gslt, mc, backup, vintage]
      command:
        description: "command: a TF2 console command (command action), or the text to run as root (run action)."
        required: false
        default: ""

jobs:
  tools:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      COMMAND: ${{ inputs.command }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      MC_DISCORD_TOKEN: ${{ secrets.MC_DISCORD_TOKEN }}
      TF2_GSLT: ${{ secrets.TF2_GSLT }}
      STORIES_KEY: ${{ secrets.STORIES_KEY }}
      BBS_SYSPASS: ${{ secrets.BBS_SYSPASS }}
      LOUNGE_PASS: ${{ secrets.LOUNGE_PASS }}
      AURABOT_PASS: ${{ secrets.AURABOT_PASS }}
      DOVE_PASS: ${{ secrets.DOVE_PASS }}
      ACCOUNTS_KEY: ${{ secrets.ACCOUNTS_KEY }}
      PCLOUD_RCLONE_TOKEN: ${{ secrets.PCLOUD_RCLONE_TOKEN }}
      PCLOUD_HOST: ${{ secrets.PCLOUD_HOST }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          set +e
          mkdir -p ~/.ssh && umask 077 && printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSHO="-i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 -o LogLevel=ERROR"
          vps() { ssh $SSHO "$VPS_USER@$VPS_HOST" "$@"; }
          hide() { sed -E 's/(sv_setsteamaccount )[A-Fa-f0-9]+/\1(hidden)/g; s/[0-9]{1,3}(\.[0-9]{1,3}){3}/(ip)/g; s/([0-9a-fA-F]{0,4}:){3,7}[0-9a-fA-F]{1,4}/(ip)/g; s/STEAM_[0-5]:[01]:[0-9]+/(steamid)/g; s/\[U:1:[0-9]+\]/(steamid)/g; s/7656119[0-9]{10}/(steamid)/g'; }   # the repo is public: never show the login token
          gslt() {   # puts the login token (TF2_GSLT) in the tf2 service launch line, before +map; any old one is replaced
            T=$(printf '%s' "$TF2_GSLT" | tr -cd 'A-Fa-f0-9')
            if [ -z "$T" ]; then echo "No TF2_GSLT repo secret, so no login token was set." >> "$R"
            else
              printf '%s' "$T" | vps 'umask 077; cat > /root/tf2-gslt; S=/etc/systemd/system/tf2.service; T=$(cat /root/tf2-gslt); sed -i -E "/^ExecStart=/{s/ \+sv_setsteamaccount [A-Fa-f0-9]+//; s/ \+map / +sv_setsteamaccount $T +map /}" $S; systemctl daemon-reload; grep -c "sv_setsteamaccount" $S | sed "s/^/token lines in service file: /"' >> "$R" 2>&1
            fi
          }
          R="$RUNNER_TEMP/result.txt"; : > "$R"
          case "$ACTION" in
            setup)
              scp $SSHO vps/setup.sh "$VPS_USER@$VPS_HOST:/root/setup.sh" >> "$R" 2>&1 \
                && vps "bash /root/setup.sh" 2>&1 | tail -n 40 >> "$R" \
                && gslt ;;
            run)
              # root shell: runs the text in the box as root on the VPS. The repo is public, so the output is public: never print passwords, tokens, IPs or Steam IDs.
              # keeps the story door's key (repo secret STORIES_KEY) on the server for the story tools; never printed
              [ -n "$STORIES_KEY" ] && printf '%s' "$STORIES_KEY" | vps 'umask 077; mkdir -p /etc/l4d-story; cat > /etc/l4d-story/stories.key' >> "$R" 2>&1
              # the BBS system password (repo secret BBS_SYSPASS) for bbs/setup.sh; never printed
              [ -n "$BBS_SYSPASS" ] && printf '%s' "$BBS_SYSPASS" | vps 'umask 077; cat > /root/bbs-syspass' >> "$R" 2>&1
              # WeeChat's relay password (repo secret LOUNGE_PASS, kept from The Lounge) for vps/weechat-setup.sh; never printed
              [ -n "$LOUNGE_PASS" ] && printf '%s' "$LOUNGE_PASS" | vps 'umask 077; cat > /root/weechat-pass' >> "$R" 2>&1
              # AuraBot's admin login password (repo secret AURABOT_PASS) for vps/aurabot-setup.sh; never printed
              [ -n "$AURABOT_PASS" ] && printf '%s' "$AURABOT_PASS" | vps 'umask 077; cat > /root/aurabot-pass' >> "$R" 2>&1
              # the BBS's DOVE-Net (Vertrauen QWK account) password (repo secret DOVE_PASS) for bbs/setup.sh; never printed
              [ -n "$DOVE_PASS" ] && printf '%s' "$DOVE_PASS" | vps 'umask 077; cat > /root/dove-pass' >> "$R" 2>&1
              # the shared Accounts key (repo secret ACCOUNTS_KEY) for the BBS passkey login; readable only by the bbs user; never printed
              [ -n "$ACCOUNTS_KEY" ] && printf '%s' "$ACCOUNTS_KEY" | vps 'umask 077; mkdir -p /sbbs/ctrl/secrets; cat > /sbbs/ctrl/secrets/accounts-key; chown -R bbs:bbs /sbbs/ctrl/secrets; chmod 700 /sbbs/ctrl/secrets; echo "accounts key: $(wc -c < /sbbs/ctrl/secrets/accounts-key) bytes (not shown)"' >> "$R" 2>&1
              [ -n "$COMMAND" ] && vps "$COMMAND" 2>&1 | hide | tail -c 8000 >> "$R" || echo "Put a command in the box." >> "$R" ;;
            status) vps "systemctl is-active tf2; df -h /home | tail -1; free -m | sed -n 2p" >> "$R" 2>&1 ;;
            l4d-deploy)
              # box: classic, versus or vintage, optionally followed by "clean" (fresh MetaMod/SourceMod install)
              ARGS=$(printf '%s' "$COMMAND" | tr -cd 'a-z ')
              vps 'rm -rf /root/l4d-deploy' >> "$R" 2>&1
              scp -r $SSHO l4d "$VPS_USER@$VPS_HOST:/root/l4d-deploy" >> "$R" 2>&1 \
                && vps "bash /root/l4d-deploy/deploy.sh $ARGS" 2>&1 | tail -c 3000 >> "$R" ;;
            tf2-prune-maps)
              # box: dry (default, only shows what would go) or go. Keeps the map cycle maps and maps with a .nav file.
              A=dry; [ "$COMMAND" = go ] && A=go
              scp $SSHO tf/prune-maps.sh "$VPS_USER@$VPS_HOST:/root/prune-maps.sh" >> "$R" 2>&1 \
                && vps "bash /root/prune-maps.sh $A" 2>&1 | tail -c 3000 >> "$R" ;;
            ban-player)
              # box: the exact player name (letters, digits, _ . -). Permanent ban on every running L4D server; the Steam ID is not shown.
              N=$(printf '%s' "$COMMAND" | tr -cd 'A-Za-z0-9_.-')
              [ -n "$N" ] || { echo "Give the exact player name." >> "$R"; } 
              [ -z "$N" ] || { scp $SSHO vps/ban-player.sh "$VPS_USER@$VPS_HOST:/root/ban-player.sh" >> "$R" 2>&1 \
                && vps "bash /root/ban-player.sh '$N'" 2>&1 | tail -c 1500 >> "$R"; } ;;
            l4d-setup)
              # box: classic (installs the game), versus or vintage (a copy of classic). Starts nothing.
              A=""
              case "$COMMAND" in
                classic) S=setup-l4d.sh ;;
                versus) S=setup-l4d-b.sh ;;
                vintage) S=setup-l4d-extra.sh; A="c 27018 coop l4d_hospital01_apartment '~*~88x31~*~ L4D ViNtaGe Edition'" ;;
                *) S=""; echo "Box: classic, versus or vintage." >> "$R" ;;
              esac
              [ -z "$S" ] || { scp $SSHO "vps/$S" "$VPS_USER@$VPS_HOST:/root/$S" >> "$R" 2>&1 \
                && vps "bash /root/$S $A" 2>&1 | tail -c 2500 >> "$R"; } ;;
            add-admin)
              SID="$COMMAND"
              if printf '%s' "$SID" | grep -Eq '^7656[0-9]{13}$'; then   # SteamID64 -> STEAM_0:y:z
                acc=$((SID - 76561197960265728)); SID="STEAM_0:$((acc % 2)):$((acc / 2))"
              fi
              if printf '%s' "$SID" | grep -Eq '^STEAM_[0-5]:[01]:[0-9]{1,12}$'; then
                vps "f=/home/tf2/server/tf/addons/sourcemod/configs/admins_simple.ini; if grep -qF '\"$SID\"' \$f 2>/dev/null; then echo 'already an admin'; else printf '\"%s\" \"z\"\n' '$SID' >> \$f; echo 'added'; fi; chown tf2:tf2 \$f; sudo -u tf2 screen -S tf2 -X stuff \"sm_reloadadmins\$(printf '\\r')\"; tail -n 3 \$f" >> "$R" 2>&1
              else echo "Give a Steam ID like STEAM_0:1:12345 or a 17-digit SteamID64." >> "$R"; fi ;;
            install-maps)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z0-9_]{3,60}( [a-z0-9_]{3,60}){0,19}$'; then
                vps "command -v bzip2 >/dev/null || apt-get install -y -qq bzip2 >/dev/null 2>&1; cd /home/tf2/server/tf/maps && for m in $COMMAND; do if [ -f \$m.bsp ]; then echo \$m: already there; elif curl -fsSL -m 120 -o \$m.bsp.bz2 https://fastdl.serveme.tf/maps/\$m.bsp.bz2 && bzip2 -df \$m.bsp.bz2; then chown tf2:tf2 \$m.bsp; echo \$m: installed; else rm -f \$m.bsp.bz2; echo \$m: not found; fi; done" 2>&1 | tail -c 3000 >> "$R"
              else echo "Give map names like koth_coldline cp_glacier (letters, digits, _ only, up to 20)." >> "$R"; fi ;;
            generate-navs)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z0-9_]{3,60}( [a-z0-9_]{3,60}){0,19}$'; then
                scp $SSHO vps/generate-navs.sh "$VPS_USER@$VPS_HOST:/root/generate-navs.sh" >> "$R" 2>&1 \
                  && vps "systemctl stop navgen 2>/dev/null; systemctl reset-failed navgen 2>/dev/null; systemd-run --unit navgen --collect /bin/bash /root/generate-navs.sh $COMMAND" 2>&1 | tail -n 5 >> "$R"
              else echo "Give map names like koth_snowtower cp_frostwatch (letters, digits, _ only, up to 20)." >> "$R"; fi ;;
            system-check)
              vps 'cat /etc/os-release | head -2; uptime; free -m | sed -n 1,2p; df -h / | tail -1; echo "-- listening:"; ss -tulnp | head -15; echo "-- ufw:"; (ufw status 2>&1 | head -5); echo "-- ssh login rules:"; (sshd -T 2>/dev/null | grep -E "^(passwordauthentication|permitrootlogin|pubkeyauthentication|kbdinteractiveauthentication) "); echo "-- fail2ban:"; (systemctl is-active fail2ban; fail2ban-client status sshd 2>&1 | grep -E "Currently|Total|Jail|Error|error")' 2>&1 | tail -c 3000 >> "$R" ;;
            motd)
              # box: the job, then its own text. Jobs: classic, versus, host.
              SUB=${COMMAND%% *}; COMMAND=${COMMAND#"$SUB"}; COMMAND=${COMMAND# }
              case "$SUB" in
              host)
              scp $SSHO l4d/motd/host.txt "$VPS_USER@$VPS_HOST:/root/host.txt" >> "$R" 2>&1 \
                && vps 'for d in l4d l4d-b l4d-c; do G=/home/tf2/$d/left4dead; if [ -d $G ]; then install -o tf2 -g tf2 -m 644 /root/host.txt $G/host.txt && echo "$d: $(cat $G/host.txt)"; else echo "$d: no folder"; fi; done' >> "$R" 2>&1 ;;
              classic)
              scp $SSHO l4d/motd/motd.txt "$VPS_USER@$VPS_HOST:/home/tf2/l4d/left4dead/" >> "$R" 2>&1 \
                && vps 'cd /home/tf2/l4d/left4dead && chown tf2:tf2 motd.txt; sed -i "s/<!--LEADERBOARD-->//" motd.txt; ls -l motd.txt' >> "$R" 2>&1
              scp $SSHO l4d/motd/motd.txt "$VPS_USER@$VPS_HOST:/root/l4d-motd-template.html" >> "$R" 2>&1 \
                && vps 'D=/home/tf2/leaderboard-l4d; if [ -d $D ]; then install -o tf2 -g tf2 -m 644 /root/l4d-motd-template.html $D/template.html && systemctl start leaderboard-l4d.service && echo "leaderboard rebuilt"; fi' >> "$R" 2>&1 ;;
              versus)
              scp $SSHO l4d/motd/motd-vs.txt "$VPS_USER@$VPS_HOST:/home/tf2/l4d-b/left4dead/motd.txt" >> "$R" 2>&1 \
                && vps 'cd /home/tf2/l4d-b/left4dead && chown tf2:tf2 motd.txt; sed -i "s/<!--LEADERBOARD-->//" motd.txt; ls -l motd.txt; grep -o "<h2>[^<]*" motd.txt' >> "$R" 2>&1
              scp $SSHO l4d/motd/motd-vs.txt "$VPS_USER@$VPS_HOST:/root/l4dvs-motd-template.html" >> "$R" 2>&1 \
                && vps 'D=/home/tf2/leaderboard-l4dvs; if [ -d $D ]; then install -o tf2 -g tf2 -m 644 /root/l4dvs-motd-template.html $D/template.html && systemctl start leaderboard-l4dvs.service && echo "leaderboard rebuilt"; fi' >> "$R" 2>&1 ;;
                *) echo "Box: one of: classic versus host" >> "$R" ;;
              esac ;;
            web)
              # box: the job, then its own text. Jobs: stats, logs, https.
              SUB=${COMMAND%% *}; COMMAND=${COMMAND#"$SUB"}; COMMAND=${COMMAND# }
              case "$SUB" in
              logs)
              H=$(printf '%s' "$COMMAND" | grep -E '^[A-Za-z0-9]{4,40}:[0-9a-f]{64}$' || true)
              scp $SSHO vps/logweb.py vps/logweb-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/logweb-setup.sh '$H'" 2>&1 | tail -c 1500 >> "$R" ;;
              stats)
              scp $SSHO vps/stats.py vps/discord-status.py vps/stats-setup.sh vps/Caddyfile "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps 'bash /root/stats-setup.sh 2>&1 | tail -n 4; install -m 644 /root/Caddyfile /etc/caddy/Caddyfile && caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -n 1; systemctl reload caddy; sleep 8; curl -s -o /dev/null -w "stats via caddy: HTTP %{http_code}\n" --resolve stats.88x31.app:443:127.0.0.1 -k https://stats.88x31.app/' 2>&1 | tail -c 2000 >> "$R" ;;
              https)
              scp $SSHO vps/Caddyfile vps/logweb.py vps/logweb-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps 'bash /root/logweb-setup.sh 2>&1 | tail -n 3; command -v caddy >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq caddy >/dev/null; caddy version | head -1; install -m 644 /root/Caddyfile /etc/caddy/Caddyfile && caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -n 2; systemctl enable caddy >/dev/null 2>&1; systemctl restart caddy; sleep 20; systemctl is-active caddy; journalctl -u caddy -n 40 --no-pager -o cat | grep -iE "certificate obtained|error|could not" | tail -n 6; curl -s -o /dev/null -w "map via caddy: HTTP %{http_code}\n" --resolve map.88x31.app:443:127.0.0.1 https://map.88x31.app/; curl -s -o /dev/null -w "logs on port 80: HTTP %{http_code}\n" http://127.0.0.1/' 2>&1 | tail -c 2500 >> "$R" ;;
                *) echo "Box: one of: stats logs https" >> "$R" ;;
              esac ;;
            vintage)
              # box: the job, then its own text. Jobs: private, public, unlock.
              SUB=${COMMAND%% *}; COMMAND=${COMMAND#"$SUB"}; COMMAND=${COMMAND# }
              case "$SUB" in
              private)
              if printf '%s' "$COMMAND" | grep -Eq '^[A-Za-z0-9]{1,32}$'; then
                printf '%s' "$COMMAND" | vps 'P=$(cat); C=/home/tf2/l4d-c/left4dead/cfg/server.cfg; G=/home/tf2/l4d-c/left4dead; sed -i "/^sv_password /d" $C; echo "sv_password \"$P\"" >> $C; chown tf2:tf2 $C; sudo -u tf2 screen -S l4dc -X stuff "sv_password $P$(printf "\r")"; systemctl disable --now leaderboard-l4dc.timer >/dev/null 2>&1; [ -f $G/motd.txt ] && mv $G/motd.txt $G/motd.txt.off; echo "password set (not shown); motd: $(ls $G/motd.txt* 2>/dev/null | tr "\n" " ")"; echo "leaderboard timer: $(systemctl is-active leaderboard-l4dc.timer)"' >> "$R" 2>&1
              else echo "Give a password of letters and digits only." >> "$R"; fi ;;
              public)
              vps 'C=/home/tf2/l4d-c/left4dead/cfg/server.cfg; G=/home/tf2/l4d-c/left4dead; sed -i "/^sv_password /d" $C; sudo -u tf2 screen -S l4dc -X stuff "sv_password \"\"$(printf "\r")"; [ -f $G/motd.txt.off ] && mv $G/motd.txt.off $G/motd.txt; systemctl enable --now leaderboard-l4dc.timer >/dev/null 2>&1; systemctl start leaderboard-l4dc.service; echo "public again; motd: $(ls $G/motd.txt* | tr "\n" " ")"; echo "leaderboard timer: $(systemctl is-active leaderboard-l4dc.timer)"' >> "$R" 2>&1 ;;
              unlock)
              vps 'C=/home/tf2/l4d-c/left4dead/cfg/server.cfg; sed -i "/^sv_password /d" $C; sudo -u tf2 screen -S l4dc -X stuff "sv_password \"\"$(printf "\r")"; echo "password lines left in server.cfg: $(grep -c "^sv_password" $C)"; echo "banner picture served (width, height):"; curl -s http://127.0.0.1/banner/banner.png | python3 -c "import sys,struct;d=sys.stdin.buffer.read();print(struct.unpack(\">II\",d[16:24]),len(d),\"bytes\")"' >> "$R" 2>&1 ;;
                *) echo "Box: one of: private public unlock" >> "$R" ;;
              esac ;;
            leaderboard)
              # box: the job, then its own text. Jobs: install, ignore.
              SUB=${COMMAND%% *}; COMMAND=${COMMAND#"$SUB"}; COMMAND=${COMMAND# }
              case "$SUB" in
              install)
              # box: tf2, l4d, l4dvs, l4dc or all, then optional days (default 5). Example: "tf2 5". Builds the welcome page with the stats board and starts its 5-minute timer.
              W=$(printf '%s' "$COMMAND" | awk '{print $1}'); D=$(printf '%s' "$COMMAND" | awk '{print $2}' | grep -E '^[0-9]+$' || true)
              [ "$W" = all ] && W="l4d l4dvs l4dc tf2"
              case "$W" in l4d|l4dvs|l4dc|tf2|"l4d l4dvs l4dc tf2") ;; *) echo "Box: tf2, l4d, l4dvs, l4dc or all, then optional days." >> "$R"; W="" ;; esac
              for G in $W; do
                T=l4d/motd/motd.txt; [ "$G" = tf2 ] && T=tf/cfg/motd.txt; [ "$G" = l4dvs ] && T=l4d/motd/motd-vs.txt
                if [ "$G" = l4dc ]; then sed 's|<h2>[^<]*</h2>|<h2>~*~88x31~*~ L4D ViNtaGe Edition</h2>|' l4d/motd/motd.txt > /tmp/motd-l4dc.html; T=/tmp/motd-l4dc.html; fi
                scp $SSHO vps/leaderboard.py vps/leaderboard-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                  && scp $SSHO "$T" "$VPS_USER@$VPS_HOST:/root/$G-motd-template.html" >> "$R" 2>&1 \
                  && vps "bash /root/leaderboard-setup.sh $G $D" 2>&1 | tail -c 1500 >> "$R"
              done ;;
              ignore)
              ID=$(printf '%s' "$COMMAND" | grep -Eo '^STEAM_[0-5]:[01]:[0-9]{1,12}$' || true)
              if [ -z "$ID" ]; then echo "Give a Steam ID like STEAM_0:1:12345." >> "$R"
              else
                vps "F=/home/tf2/leaderboard-ignore.txt; touch \$F; if grep -qF '$ID' \$F; then echo 'already ignored'; else echo '$ID' >> \$F; echo 'added to the ignore list'; fi; chown tf2:tf2 \$F; chmod 600 \$F; wc -l < \$F | sed 's/^/ignored accounts: /'; for g in l4d tf2 l4dvs l4dc; do if [ -d /home/tf2/leaderboard-\$g ]; then systemctl start leaderboard-\$g.service && echo \"\$g leaderboard rebuilt\"; fi; done" >> "$R" 2>&1
              fi ;;
                *) echo "Box: one of: install ignore" >> "$R" ;;
              esac ;;
            l4d-sessions)
              vps 'for d in l4d l4d-b l4d-c; do echo "== $d"; find /home/tf2/$d/left4dead/logs -name "L*.log" -mmin -180 | sort | xargs -r cat | grep -E "\" (connected|disconnected)" | grep -v "<BOT>" | sed -E "s/<[0-9]+><STEAM_[0-9:]+>//g; s/STEAM_[0-9]:[0-9]:[0-9]+/(id)/g; s/\[U:1:[0-9]+\]/(id)/g; s/, address \"[^\"]*\"//; s/^L //; s/^[0-9\/]+ - //" | sort -u | tail -n 40; done' 2>&1 | tail -c 3500 >> "$R" ;;
            tf2-gslt) gslt ;;
            mc)
              # Minecraft jobs. Box: <job> then that job's own text. Jobs: setup, set, motd, discord-install, discord-format, bluemap-install, plugin-install, bluemap-render, import.
              SUB=${COMMAND%% *}; COMMAND=${COMMAND#"$SUB"}; COMMAND=${COMMAND# }
              case "$SUB" in
              setup)
              scp $SSHO vps/setup-minecraft.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                && vps "bash /root/setup-minecraft.sh" 2>&1 | tail -c 2500 >> "$R" ;;
              set)   # box: key=value for server.properties (applies on next mc restart)
              if printf '%s' "$COMMAND" | grep -Eq '^[a-z.-]{2,50}=[A-Za-z0-9_.-]{0,40}$'; then
                k=${COMMAND%%=*}
                vps "f=/home/tf2/mc/server.properties; if grep -q '^$k=' \$f; then sed -i 's|^$k=.*|$COMMAND|' \$f; else echo '$COMMAND' >> \$f; fi; grep '^$k=' \$f; echo players:; sudo -u tf2 screen -S mc -X stuff \"list\$(printf '\\r')\"; sleep 1; tail -n 2 /home/tf2/mc/logs/latest.log" 2>&1 | tail -c 1500 >> "$R"
              else echo "Give key=value." >> "$R"; fi ;;
              motd)   # fixed server description; applies on next mc restart
              vps 'f=/home/tf2/mc/server.properties; sed -i "s|^motd=.*|motd=\\\\u00a7d~*~88x31 cLuB~*~\\\\u00a7r mInEcRaFt VaNiLLa|" $f; grep ^motd= $f; echo players:; sudo -u tf2 screen -S mc -X stuff "list$(printf "\r")"; sleep 1; tail -n 1 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 1500 >> "$R" ;;
              discord-install)
              CH=$(printf '%s' "$COMMAND" | tr -cd '0-9')
              if [ -z "$MC_DISCORD_TOKEN" ] || [ -z "$CH" ]; then echo "Needs the MC_DISCORD_TOKEN secret and a channel ID in the box." >> "$R"
              else
                printf '%s' "$MC_DISCORD_TOKEN" | vps 'umask 077; cat > /root/mc-discord-token' 2>&1 >> "$R"
                vps "P=/home/tf2/mc/plugins; C=\$P/DiscordSRV/config.yml
                  U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/discordsrv/version?loaders=%5B%22paper%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                  [ -n \"\$U\" ] || { echo 'could not find DiscordSRV on Modrinth'; exit 0; }
                  echo \"DiscordSRV \${U%% *}\"; curl -fsSL -o \$P/DiscordSRV.jar.new \"\${U#* }\" && mv \$P/DiscordSRV.jar.new \$P/DiscordSRV.jar || { echo 'download failed'; exit 0; }
                  chown tf2:tf2 \$P/DiscordSRV.jar
                  if [ ! -f \$C ]; then systemctl restart mc; for i in \$(seq 60); do [ -f \$C ] && break; sleep 3; done; fi
                  [ -f \$C ] || { echo 'DiscordSRV did not make its config'; exit 0; }
                  T=\$(cat /root/mc-discord-token); sed -i -e \"s|^BotToken:.*|BotToken: \\\"\$T\\\"|\" -e \"s|^Channels:.*|Channels: {\\\"global\\\": \\\"$CH\\\"}|\" \$C; T=
                  rm -f /root/mc-discord-token; chown tf2:tf2 \$C; systemctl restart mc; sleep 40
                  grep -i 'discordsrv' /home/tf2/mc/logs/latest.log | grep -iv token | tail -n 12" 2>&1 | tail -c 2500 >> "$R"
              fi ;;
              discord-format)
              vps 'M=/home/tf2/mc/plugins/DiscordSRV/messages.yml; echo before:; grep -n "^DiscordToMinecraftChatMessageFormat\|^MinecraftChatToDiscordMessageFormat" $M
                sed -i -e "s|^DiscordToMinecraftChatMessageFormat:.*|DiscordToMinecraftChatMessageFormat: \"%toprolecolor%%name%<reset>%reply% » %message%\"|" -e "s|^DiscordToMinecraftChatMessageFormatNoRole:.*|DiscordToMinecraftChatMessageFormatNoRole: \"%name%%reply% » %message%\"|" -e "s|^MinecraftChatToDiscordMessageFormat:.*|MinecraftChatToDiscordMessageFormat: \"**%displayname%** » %message%\"|" -e "s|^MinecraftChatToDiscordMessageFormatNoPrimaryGroup:.*|MinecraftChatToDiscordMessageFormatNoPrimaryGroup: \"**%displayname%** » %message%\"|" $M
                echo after:; grep -n "^DiscordToMinecraftChatMessageFormat\|^MinecraftChatToDiscordMessageFormat" $M
                sudo -u tf2 screen -S mc -X stuff "discord reload$(printf "\r")"; sleep 4; tail -n 4 /home/tf2/mc/logs/latest.log' 2>&1 | tail -c 1500 >> "$R" ;;
              bluemap-install)
              vps "P=/home/tf2/mc/plugins
                U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/bluemap/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.3%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                [ -n \"\$U\" ] || { echo 'could not find BlueMap for 26.3 on Modrinth'; exit 0; }
                echo \"BlueMap \${U%% *}\"; curl -fsSL -o \$P/BlueMap.jar.new \"\${U#* }\" && mv \$P/BlueMap.jar.new \$P/BlueMap.jar || { echo 'download failed'; exit 0; }
                chown tf2:tf2 \$P/BlueMap.jar; systemctl restart mc; sleep 50
                grep -i 'bluemap' /home/tf2/mc/logs/latest.log | tail -n 8; grep -n 'accept-download' \$P/BlueMap/core.conf 2>/dev/null" 2>&1 | tail -c 2000 >> "$R" ;;
              plugin-install)
              S=$(printf '%s' "$COMMAND" | tr -cd 'a-z0-9_-')
              if [ -z "$S" ]; then echo "Put the plugin's Modrinth name in the box." >> "$R"; else
              vps "P=/home/tf2/mc/plugins
                U=\$(curl -fsS -A '88x31-mc-setup (ryan)' 'https://api.modrinth.com/v2/project/$S/version?loaders=%5B%22paper%22%5D&game_versions=%5B%2226.3%22%5D' | python3 -c 'import json,sys;v=json.load(sys.stdin)[0];print(v[\"version_number\"],v[\"files\"][0][\"url\"])')
                [ -n \"\$U\" ] || { echo 'no Paper build of $S for 26.3 on Modrinth, nothing changed'; exit 0; }
                echo \"$S \${U%% *}\"; curl -fsSL -o \$P/$S.jar.new \"\${U#* }\" && mv \$P/$S.jar.new \$P/$S.jar || { echo 'download failed'; exit 0; }
                chown tf2:tf2 \$P/$S.jar; systemctl restart mc; sleep 50
                grep -i '$S' /home/tf2/mc/logs/latest.log | tail -n 6" 2>&1 | tail -c 2000 >> "$R"; fi ;;
              bluemap-render)
              set -- $(printf '%s' "$COMMAND" | tr -cd '0-9 -')
              if [ $# -lt 3 ]; then echo "Give X Z RADIUS [THREADS], like -330 73 1000 or -330 73 1000 2." >> "$R"; else
              vps "B=/home/tf2/mc/plugins/BlueMap; X=$1; Z=$2; R=$3; N=${4:-1}
                sed -i -e 's/^accept-download:.*/accept-download: true/' -e \"s/^render-thread-count:.*/render-thread-count: \$N/\" \$B/core.conf
                mask() { f=\$B/maps/\$1.conf; [ -f \$f ] || return; sed -i '/^# 88x31 render area/,\$d' \$f
                  printf '# 88x31 render area (mc-bluemap-render)\nrender-mask: [ { min-x: %d, max-x: %d, min-z: %d, max-z: %d } ]\n' \$((\$2-\$4)) \$((\$2+\$4)) \$((\$3-\$4)) \$((\$3+\$4)) >> \$f; }
                mask world \$X \$Z \$R; mask world_the_end \$X \$Z \$R; mask world_the_nether \$((\$X/8)) \$((\$Z/8)) \$((\$R/8))
                chown -R tf2:tf2 \$B; grep -n '^accept-download\|^render-thread-count' \$B/core.conf; tail -n 1 \$B/maps/world.conf
                sudo -u tf2 screen -S mc -X stuff \"bluemap reload\$(printf '\\r')\"; sleep 25
                grep -i 'bluemap' /home/tf2/mc/logs/latest.log | tail -n 8" 2>&1 | tail -c 2000 >> "$R"; fi ;;
              import)
              vps 'Z=/root/world2.zip; D=/home/tf2/mc; T=$D/import-tmp
                [ -f $Z ] || { echo "no $Z"; exit 0; }
                command -v unzip >/dev/null || { echo "unzip is not installed"; exit 0; }
                unzip -tq $Z >/dev/null || { echo "zip is incomplete or broken (still uploading?)"; exit 0; }
                [ -e $D/world-old ] && { echo "$D/world-old already exists, not touching anything"; exit 0; }
                rm -rf $T; mkdir -p $T; unzip -q $Z -d $T || { echo "unzip failed"; rm -rf $T; exit 0; }
                L=$(find $T -maxdepth 3 -name level.dat | head -1); [ -n "$L" ] || { echo "no level.dat in the zip"; rm -rf $T; exit 0; }
                systemctl stop mc; [ -d $D/world ] && mv $D/world $D/world-old
                mv "$(dirname "$L")" $D/world; rm -rf $T; rm -f $D/world/session.lock; chown -R tf2:tf2 $D/world
                systemctl start mc; sleep 3; systemctl is-active mc; du -sh $D/world $D/world-old 2>/dev/null; df -h /home | tail -1' 2>&1 | tail -c 1500 >> "$R" ;;
                *) echo "Box: one of: setup set motd discord-install discord-format bluemap-install plugin-install bluemap-render import, then its own text." >> "$R" ;;
              esac ;;
            backup)
              # box: the job, then its own text. Jobs: install, run, status, restore.
              SUB=${COMMAND%% *}; COMMAND=${COMMAND#"$SUB"}; COMMAND=${COMMAND# }
              case "$SUB" in
              install)
              if [ -z "$PCLOUD_RCLONE_TOKEN" ] || [ -z "$RESTIC_PASSWORD" ]; then echo "Add repo secrets PCLOUD_RCLONE_TOKEN and RESTIC_PASSWORD first." >> "$R"
              else
                printf '%s' "$PCLOUD_RCLONE_TOKEN" | vps 'umask 077; cat > /root/pcloud-token'
                printf '%s' "$RESTIC_PASSWORD" | vps 'umask 077; cat > /root/restic-password'
                printf '%s' "$PCLOUD_HOST" | vps 'umask 077; cat > /root/pcloud-host'
                scp $SSHO vps/backup-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                  && vps 'bash /root/backup-setup.sh' 2>&1 | tail -c 2000 >> "$R"
              fi ;;
              run)
              if printf '%s' "$COMMAND" | grep -Eq '^keep( [0-9a-f]{8})?$'; then vps "/usr/local/bin/vps-backup $COMMAND" 2>&1 | tail -c 1500 >> "$R"
              else vps 'systemctl start --no-block vps-backup.service; sleep 60; systemctl is-active vps-backup.service; journalctl -u vps-backup -n 15 --no-pager -o cat | tail -n 15' 2>&1 | tail -c 2500 >> "$R" ; fi ;;
              status) vps '/usr/local/bin/vps-backup status; systemctl list-timers vps-backup.timer --no-legend' 2>&1 | tail -c 2500 >> "$R" ;;
              restore)
              if [ -z "$PCLOUD_RCLONE_TOKEN" ] || [ -z "$RESTIC_PASSWORD" ]; then echo "Add repo secrets PCLOUD_RCLONE_TOKEN and RESTIC_PASSWORD first." >> "$R"
              else
                MODE=look; printf '%s' "$COMMAND" | grep -qi '^apply' && MODE=apply
                SNAP=$(printf '%s' "$COMMAND" | grep -Eo '[0-9a-f]{8,64}' | head -n 1); [ -n "$SNAP" ] || SNAP=latest
                printf '%s' "$PCLOUD_RCLONE_TOKEN" | vps 'umask 077; cat > /root/pcloud-token'
                printf '%s' "$RESTIC_PASSWORD" | vps 'umask 077; cat > /root/restic-password'
                printf '%s' "$PCLOUD_HOST" | vps 'umask 077; cat > /root/pcloud-host'
                scp $SSHO vps/backup-setup.sh "$VPS_USER@$VPS_HOST:/root/" >> "$R" 2>&1 \
                  && vps "bash /root/backup-setup.sh >/dev/null 2>&1; export RESTIC_REPOSITORY=rclone:pcloud:Backups/vps-backup RESTIC_PASSWORD_FILE=/root/restic-password HOME=/root; T=/root/restore; [ $MODE = apply ] && T=/; restic restore $SNAP --target \$T 2>&1 | tail -n 4; echo \"restored $SNAP into \$T\"; [ $MODE = apply ] || du -sh /root/restore" 2>&1 | tail -c 2000 >> "$R"
              fi ;;
                *) echo "Box: one of: install run status restore" >> "$R" ;;
              esac ;;
          esac
          [ -s "$R" ] || echo "(no output)" >> "$R"
          m=$(tail -c 7000 "$R" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/ | /g')
          echo "::notice title=VPS $ACTION::$m"
