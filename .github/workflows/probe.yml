name: Probe TF2 server file upload

# One-time test, second version. Runs when this file is pushed, or by hand from the Actions tab.
# 1) Tries several folder-list addresses on the panel to find the one that works.
# 2) Reads sizes (plugins folder, and the 3 scratch files left by the first test) - read-only.
# 3) Deletes the 3 scratch files (/tf/88x31_probe_m1.bin, _m2.bin, _m3.bin) and checks they are gone.
# Results are printed as annotations.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe the panel
        run: |
          API="$PTERO_URL/api/client/servers/$PTERO_SERVER_ID"
          H=(-H "Authorization: Bearer $PTERO_API_KEY" -H "Accept: application/json")
          enc() { jq -rn --arg s "$1" '$s|@uri'; }
          note() { echo "::notice::$*"; }

          # 1. Find a folder-list address that answers with a JSON list.
          LIST_ROUTE=""; LIST_PARAM=""
          for cand in "files/list?directory" "files/list?path" "files/directory?directory" "files/directory?path" "files?directory" "files?path"; do
            route=${cand%%\?*}; param=${cand#*\?}
            out=$(curl -sS -w $'\n%{http_code}' "$API/$route?$param=%2Ftf" "${H[@]}" 2>&1 || true)
            code=${out##*$'\n'}; text=${out%$'\n'*}
            if echo "$text" | jq -e '.data|type=="array"' >/dev/null 2>&1; then
              ok="JSON LIST"; [ -z "$LIST_ROUTE" ] && LIST_ROUTE=$route && LIST_PARAM=$param
            else ok="not a list"; fi
            note "ROUTE GET $route?$param=/tf -> HTTP $code, $ok, starts: $(echo "$text" | tr '\n' ' ' | cut -c1-110)"
          done

          list_dir() { curl -sS "$API/$LIST_ROUTE?$LIST_PARAM=$(enc "$1")" "${H[@]}" 2>/dev/null; }
          server_size() { # folder name
            [ -z "$LIST_ROUTE" ] && { echo "no-list-route"; return; }
            list_dir "$1" | jq -r --arg n "$2" '[.data[]? | select(.attributes.name==$n) | .attributes.size][0] // "none"' 2>/dev/null || echo none
          }

          if [ -z "$LIST_ROUTE" ]; then
            note "NO WORKING LIST ADDRESS FOUND - cannot read sizes"
          else
            note "USING list address: $LIST_ROUTE?$LIST_PARAM="
            note "RAW first entry of /tf listing: $(list_dir /tf | jq -c '.data[0]' 2>/dev/null | cut -c1-300)"
            note "NAMES in /tf: $(list_dir /tf | jq -r '[.data[]?.attributes.name] | join(" ")' 2>/dev/null | cut -c1-400)"
            # 2. Read-only sizes: real plugins vs repo, and the scratch files from the first test.
            for n in freezetag.smx 88x31_settings.smx; do
              note "SIZE plugin $n: server=$(server_size /tf/addons/sourcemod/plugins "$n") repo=$(stat -c %s tf/addons/sourcemod/plugins/$n)"
            done
            repo_size=$(stat -c %s tf/addons/sourcemod/plugins/freezetag.smx)
            for m in m1 m2 m3; do
              note "SIZE scratch 88x31_probe_$m.bin: server=$(server_size /tf 88x31_probe_$m.bin) repo copy of freezetag.smx=$repo_size (m1=octet-stream, m2=text/plain, m3=curl default)"
            done
          fi

          # 3. Delete the scratch files. Try request shapes until one is accepted, then check.
          gone() { [ -n "$LIST_ROUTE" ] && [ "$(server_size /tf 88x31_probe_m1.bin)" = "none" ] && [ "$(server_size /tf 88x31_probe_m2.bin)" = "none" ] && [ "$(server_size /tf 88x31_probe_m3.bin)" = "none" ]; }
          try_delete() { # label json
            r=$(curl -sS -w ' HTTP %{http_code}' -X POST "$API/files/delete" "${H[@]}" -H "Content-Type: application/json" -d "$2" 2>&1 || true)
            note "DELETE $1: $(echo "$r" | tr '\n' ' ' | cut -c1-200)"
          }
          try_delete "root+paths(names)" '{"root":"/tf","paths":["88x31_probe_m1.bin","88x31_probe_m2.bin","88x31_probe_m3.bin"]}'
          if gone; then note "SCRATCH FILES GONE after shape 1"; else
            try_delete "paths(full paths)" '{"paths":["/tf/88x31_probe_m1.bin","/tf/88x31_probe_m2.bin","/tf/88x31_probe_m3.bin"]}'
            if gone; then note "SCRATCH FILES GONE after shape 2"; else note "SCRATCH FILES NOT CONFIRMED GONE (list address found: ${LIST_ROUTE:-none})"; fi
          fi
