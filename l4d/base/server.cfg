// Shared by all L4D servers. Per-server settings (name, mode, map order) come from l4d/servers/<name>.conf.
// deploy.sh adds the rcon password and the per-server lines below this.
log on
sv_logfile 1
sv_log_onefile 0
sv_logecho 0
sv_logflush 1          // write each log line right away, so the Discord feed sees events as they happen
// 60 tick (Tickrate Enabler + "-tickrate 60" in the launch line, set by deploy.sh). sv_maxrate is already 0 = no cap.
// L4D1 hides the update/cmd rate settings ("Unknown command"), so they go through SourceMod's sm_cvar.
// min = max = 60, so every player gets 60 updates without changing their own settings (default cl_updaterate is 20).
sm_cvar sv_minupdaterate 60
sm_cvar sv_maxupdaterate 60
sm_cvar sv_mincmdrate 60
sm_cvar sv_maxcmdrate 60
sv_minrate 20000       // old clients default to a low rate, which chokes at 60 tick
sb_all_bot_team 1      // the round goes on when the last human survivor leaves or uses !afk (otherwise it counts as a loss and restarts)
