// Our settings for the Reverse Friendly-Fire plugin (same on every server that has it).
// deploy.sh copies this to left4dead/cfg/sourcemod/l4d2_reverse_ff.cfg; the plugin fills in all the other settings with its defaults.
// 1 = shooting a bot teammate hurts the shooter, same as shooting a human
reverseff_bot "1"
// 1 = admins take reversed damage too (no exemption)
reverseff_admin "1"
// 0 = no chat message when damage is reversed (the damage still happens)
reverseff_chatmsg "0"
// Team-killing limit: 120 friendly damage in one chapter (one map) gets a 24 hour ban (1440 minutes)
reverseff_survivormaxdmg "120"
reverseff_banduration "1440"
