# DDNet server settings. setup.sh puts this in /home/tf2/.local/share/ddnet/ (the first place DDNet looks; the copy in data/ is DDNet's default).
# Edit here, push, re-run ddnet/setup.sh, then restart "ddnet".
sv_name "88x31 | DDRace | US West"
sv_port 8303
sv_register 1                 # list it in the in-game server browser
sv_max_clients 32
sv_max_clients_per_ip 4
sv_map "Tutorial"             # bundled map; players can vote for others
sv_motd "Welcome to 88x31! Freeze tiles freeze you, teammates unfreeze you. Be kind and have fun :)"

# votes: let players change maps and restart
sv_vote_kick 1
sv_vote_spectate 1
sv_vote_map 1
add_vote "Map: Tutorial" "change_map Tutorial"
add_vote "Map: Sunny Side Up" "change_map Sunny Side Up"
add_vote "Map: Tsunami" "change_map Tsunami"
add_vote "Map: Gold Mine" "change_map Gold Mine"
add_vote "Map: LearnToPlay" "change_map LearnToPlay"
add_vote "Restart round" "restart"

sv_rcon_password ""            # empty = no remote admin
logfile "logs/server.log"
