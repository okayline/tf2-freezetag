// 88x31 server settings. Run by 88x31_settings.smx after all other config files,
// so these win over server.cfg.

// Server name
hostname "~*~88x31~*~ FrEEze tAg SeRveR:  ICEY COLD Edition"

// Bots: keep 12 players total, bots leave as real players join
tf_bot_quota 12
tf_bot_quota_mode fill
tf_bot_difficulty 1          // 0 easy, 1 normal, 2 hard, 3 expert
tf_bot_join_after_player 0   // 0 = bots join even when no real player is on

// No friendly fire
mp_friendlyfire 0

// No random crits, no random damage spread
tf_weapon_criticals 0          // 0 = no random crits
tf_damage_disablespread 1      // 1 = fixed damage, no random spread

// No "waiting for players" at map start
mp_waitingforplayers_time 0

// Frozen players are not pushed around when shot (0 = no pushing; the plugin's default is 10)
sm_freezetag_forcemulti 0

// Frozen players: forced third person view, thaw rings update 10 times a second (the smoothest), no push cap
sm_freezetag_thirdperson 1
sm_freezetag_proxpulse 0.1
sm_freezetag_forcecap 0
