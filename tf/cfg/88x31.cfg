// 88x31 server settings. Run by 88x31_settings.smx after all other config files,
// so these win over server.cfg. Edit here, push, and GitHub uploads it to the server.

// Server name
hostname "~*~88x31~*~ FrEEze tAg SeRveR:  ICEY COLD Edition"

// Bots: keep 12 players total, bots leave as real players join
tf_bot_quota 12
tf_bot_quota_mode fill
tf_bot_difficulty 2          // 0 easy, 1 normal, 2 hard, 3 expert
tf_bot_join_after_player 1   // 1 = no bots until a real player joins

// No friendly fire
mp_friendlyfire 0

// No "waiting for players" at map start
mp_waitingforplayers_time 0
